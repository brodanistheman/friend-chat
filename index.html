  function fileBadgeClass(ext){
    if (ext === 'PDF') return 'badge-red';
    if (['ZIP','RAR','7Z','TAR','GZ'].includes(ext)) return 'badge-amber';
    if (['DOC','DOCX','TXT','RTF','PAGES','MD'].includes(ext)) return 'badge-blue';
    if (['XLS','XLSX','CSV','NUMBERS'].includes(ext)) return 'badge-green';
    if (['PPT','PPTX','KEY'].includes(ext)) return 'badge-violet';
    return 'badge-neutral';
  }

  // =================================================================
  // ===================== LINK EMBED DETECTION =========================
  // =================================================================

  function classifyUrl(rawUrl){
    let u;
    try { u = new URL(rawUrl); } catch (err) { return null; }
    const host = u.hostname.replace(/^www\./,'').toLowerCase();

    if (host === 'youtube.com' || host === 'm.youtube.com') {
      let id = u.searchParams.get('v');
      if (!id) { const m = u.pathname.match(/\/(shorts|embed)\/([a-zA-Z0-9_-]{6,})/); if (m) id = m[2]; }
      if (id) return { kind: 'youtube', url: rawUrl, embedSrc: `https://www.youtube-nocookie.com/embed/${id}` };
    }
    if (host === 'youtu.be') {
      const id = u.pathname.slice(1).split('/')[0];
      if (id) return { kind: 'youtube', url: rawUrl, embedSrc: `https://www.youtube-nocookie.com/embed/${id}` };
    }
    if (host === 'vimeo.com') {
      const m = u.pathname.match(/(\d{6,})/);
      if (m) return { kind: 'vimeo', url: rawUrl, embedSrc: `https://player.vimeo.com/video/${m[1]}` };
    }
    if (host === 'open.spotify.com') {
      const m = u.pathname.match(/\/(track|album|playlist|episode|show)\/([a-zA-Z0-9]+)/);
      if (m) return { kind: 'spotify', url: rawUrl, embedSrc: `https://open.spotify.com/embed/${m[1]}/${m[2]}` };
    }
    if (host === 'soundcloud.com') {
      return { kind: 'soundcloud', url: rawUrl, embedSrc: `https://w.soundcloud.com/player/?url=${encodeURIComponent(rawUrl)}&color=%235b6ee8&auto_play=false&show_user=true&visual=false` };
    }
    if (host === 'loom.com') {
      const m = u.pathname.match(/\/share\/([a-zA-Z0-9]+)/);
      if (m) return { kind: 'loom', url: rawUrl, embedSrc: `https://www.loom.com/embed/${m[1]}` };
    }
    if (/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(u.pathname)) {
      return { kind: 'image', url: rawUrl, embedSrc: rawUrl };
    }
    return null;
  }

  function extractEmbeds(text){
    const found = text.match(/(https?:\/\/[^\s<]+)/gi) || [];
    const embeds = [];
    const seen = new Set();
    for (const raw of found) {
      if (embeds.length >= 2) break;
      const cleaned = raw.replace(/[),.;!?'"]+$/, '');
      if (seen.has(cleaned)) continue;
      const embed = classifyUrl(cleaned);
      if (embed) { embeds.push(embed); seen.add(cleaned); }
    }
    return embeds;
  }

  function buildEmbed(embed){
    if (embed.kind === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'embed-image';
      const img = document.createElement('img');
      img.src = embed.embedSrc; img.loading = 'lazy'; img.alt = 'Linked image';
      img.addEventListener('click', () => openLightbox(embed.embedSrc, 'Image'));
      wrap.appendChild(img);
      return wrap;
    }
    if (embed.kind === 'spotify' || embed.kind === 'soundcloud') {
      const wrap = document.createElement('div');
      wrap.className = 'embed-audio-frame';
      const iframe = document.createElement('iframe');
      iframe.src = embed.embedSrc; iframe.loading = 'lazy'; iframe.allow = 'autoplay; encrypted-media'; iframe.style.border = '0';
      wrap.appendChild(iframe);
      return wrap;
    }
    const wrap = document.createElement('div');
    wrap.className = 'embed-video-frame';
    const iframe = document.createElement('iframe');
    iframe.src = embed.embedSrc; iframe.loading = 'lazy';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true; iframe.style.border = '0';
    wrap.appendChild(iframe);
    return wrap;
  }

  function renderMessageText(container, text){
    const matches = [...text.matchAll(/(https?:\/\/[^\s<]+)/gi)];
    if (matches.length === 0) { container.appendChild(document.createTextNode(text)); return; }
    let lastIndex = 0;
    matches.forEach(m => {
      const start = m.index;
      const rawUrl = m[0];
      const trimMatch = rawUrl.match(/^(.*?)([),.;!?'"]*)$/);
      const cleanUrl = trimMatch ? trimMatch[1] : rawUrl;
      const trailing = trimMatch ? trimMatch[2] : '';
      if (start > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, start)));
      const a = document.createElement('a');
      a.href = cleanUrl; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.className = 'msg-link'; a.textContent = cleanUrl;
      container.appendChild(a);
      if (trailing) container.appendChild(document.createTextNode(trailing));
      lastIndex = start + rawUrl.length;
    });
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  // =================================================================
  // ========================= LIGHTBOX =================================
  // =================================================================

  function openLightbox(src, label){
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    const img = document.createElement('img');
    img.src = src; img.alt = label || '';
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button'; closeBtn.className = 'lightbox-close'; closeBtn.innerHTML = closeIconSVG();
    overlay.appendChild(img);
    overlay.appendChild(closeBtn);
    if (label) {
      const caption = document.createElement('div');
      caption.className = 'lightbox-caption'; caption.textContent = label;
      overlay.appendChild(caption);
    }
    function close(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if (e.key === 'Escape') close(); }
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
    closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  }

  // =================================================================
  // ========================= MESSAGES =================================
  // =================================================================

  function listenForMessages(){
    db.ref('messages').on('child_added', snap => appendMessage(snap.key, snap.val()));
    db.ref('messages').on('child_removed', snap => removeMessage(snap.key));
    db.ref('messages').on('child_changed', snap => {
      const bubble = chatBox.querySelector(`.bubble[data-key="${snap.key}"]`);
      if (bubble) renderReactionsInto(bubble, snap.val().reactions);
    });
  }

  function appendMessage(key, msg){
    const emptyState = chatBox.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const isOwn = msg.username.toLowerCase() === currentUsername.toLowerCase();
    const lastGroup = chatBox.lastElementChild;
    const canGroup = lastGroup &&
      lastGroup.dataset.userkey === msg.username.toLowerCase() &&
      lastGroup.dataset.own === String(isOwn) &&
      (msg.timestamp - Number(lastGroup.dataset.lastts)) < 5 * 60 * 1000;

    if (canGroup) {
      lastGroup.dataset.lastts = msg.timestamp;
      lastGroup.querySelector('.bubble-stack').appendChild(createBubble(key, msg));
    } else {
      const group = document.createElement('div');
      group.className = 'msg-group ' + (isOwn ? 'own' : 'other') + (msg.isAdmin ? ' admin-sender' : '');
      group.dataset.userkey = msg.username.toLowerCase();
      group.dataset.own = String(isOwn);
      group.dataset.lastts = msg.timestamp;

      let inner = '';
      if (!isOwn) {
        inner += `<div class="avatar" data-avatar-key="${msg.username.toLowerCase()}" data-avatar-name="${escapeHTML(msg.username)}"></div>`;
      }
      inner += '<div class="group-body">';
      if (!isOwn) {
        inner += `<div class="group-meta"><span>${escapeHTML(msg.username)}</span>${msg.isAdmin ? '<span class="tag">ADMIN</span>' : ''}<span class="group-time">${formatTime(msg.timestamp)}</span></div>`;
      }
      inner += '<div class="bubble-stack"></div></div>';
      group.innerHTML = inner;

      chatBox.appendChild(group);
      group.querySelector('.bubble-stack').appendChild(createBubble(key, msg));
      refreshAllAvatars();
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function createBubble(key, msg){
    const bubble = document.createElement('div');
    bubble.dataset.key = key;
    bubble.title = new Date(msg.timestamp).toLocaleString();

    if (msg.type === 'voice') {
      bubble.className = 'bubble bubble-voice';
      bubble.appendChild(buildAudioPlayer(msg.audioData, msg.duration, null));
    } else if (msg.type === 'image') {
      bubble.className = 'bubble bubble-media';
      const wrap = document.createElement('a');
      wrap.href = 'javascript:void(0)';
      wrap.className = 'image-msg';
      const img = document.createElement('img');
      img.src = msg.imageData; img.alt = msg.fileName || 'Shared image'; img.loading = 'lazy';
      wrap.appendChild(img);
      wrap.addEventListener('click', () => openLightbox(msg.imageData, msg.fileName || 'Image'));
      bubble.appendChild(wrap);
    } else if (msg.type === 'file' && msg.fileType && msg.fileType.startsWith('video/')) {
      bubble.className = 'bubble bubble-media';
      const wrap = document.createElement('div');
      wrap.className = 'video-msg';
      const video = document.createElement('video');
      video.src = msg.fileData; video.controls = true; video.preload = 'metadata'; video.playsInline = true;
      wrap.appendChild(video);
      bubble.appendChild(wrap);
    } else if (msg.type === 'file' && msg.fileType && msg.fileType.startsWith('audio/')) {
      bubble.className = 'bubble bubble-voice';
      bubble.appendChild(buildAudioPlayer(msg.fileData, null, msg.fileName));
    } else if (msg.type === 'file') {
      bubble.className = 'bubble';
      bubble.appendChild(buildFileCard(msg));
    } else {
      bubble.className = 'bubble';
      const textSpan = document.createElement('span');
      textSpan.className = 'bubble-text';
      renderMessageText(textSpan, msg.text || '');
      bubble.appendChild(textSpan);
      extractEmbeds(msg.text || '').forEach(embed => bubble.appendChild(buildEmbed(embed)));
    }

    const reactBtn = document.createElement('button');
    reactBtn.className = 'bubble-react';
    reactBtn.type = 'button';
    reactBtn.title = 'Add reaction';
    reactBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>';
    reactBtn.addEventListener('click', () => openEmojiPicker(reactBtn, (char) => toggleReaction(key, char)));
    bubble.appendChild(reactBtn);

    if (isAdminUser) {
      const del = document.createElement('button');
      del.className = 'bubble-delete';
      del.type = 'button';
      del.title = 'Delete message';
      del.innerHTML = closeIconSVG();
      del.addEventListener('click', () => db.ref('messages/' + key).remove());
      bubble.appendChild(del);
    }

    renderReactionsInto(bubble, msg.reactions);
    return bubble;
  }

  function toggleReaction(msgKey, emoji){
    const ref = db.ref(`messages/${msgKey}/reactions/${emoji}/${currentKey}`);
    ref.once('value').then(snap => {
      if (snap.exists()) ref.remove(); else ref.set(currentUsername);
    });
  }

  function renderReactionsInto(bubble, reactions){
    let row = bubble.querySelector('.reactions-row');
    const entries = Object.entries(reactions || {});
    if (entries.length === 0) { if (row) row.remove(); return; }
    if (!row) {
      row = document.createElement('div');
      row.className = 'reactions-row';
      const reactBtn = bubble.querySelector('.bubble-react');
      bubble.insertBefore(row, reactBtn || null);
    }
    row.innerHTML = entries.map(([emoji, users]) => {
      const names = Object.values(users || {});
      const mine = !!(users && users[currentKey]);
      return `<button type="button" class="reaction-pill${mine ? ' mine' : ''}" data-emoji="${emoji}" title="${escapeHTML(names.join(', '))}">${emoji}<span class="reaction-count">${names.length}</span></button>`;
    }).join('');
    row.querySelectorAll('.reaction-pill').forEach(btn => {
      btn.addEventListener('click', () => toggleReaction(bubble.dataset.key, btn.dataset.emoji));
    });
  }

  function buildAudioPlayer(src, knownDuration, label){
    const outer = document.createElement('div');
    if (label) {
      const labelEl = document.createElement('div');
      labelEl.className = 'audio-file-label';
      labelEl.textContent = label;
      outer.appendChild(labelEl);
    }
    const wrap = document.createElement('div');
    wrap.className = 'voice-msg';

    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'voice-play-btn'; btn.innerHTML = playIconSVG();

    const track = document.createElement('div');
    track.className = 'voice-track';
    const progress = document.createElement('div');
    progress.className = 'voice-progress';
    track.appendChild(progress);

    const time = document.createElement('span');
    time.className = 'voice-time';
    time.textContent = knownDuration ? formatDuration(knownDuration) : '0:00';

    const audio = document.createElement('audio');
    audio.className = 'voice-audio';
    audio.preload = 'metadata';
    audio.src = src;

    wrap.appendChild(btn); wrap.appendChild(track); wrap.appendChild(time); wrap.appendChild(audio);
    outer.appendChild(wrap);

    btn.addEventListener('click', () => {
      document.querySelectorAll('audio.voice-audio-playing').forEach(a => { if (a !== audio) a.pause(); });
      if (audio.paused) audio.play().catch(() => toast('Could not play this audio.', 'error'));
      else audio.pause();
    });
    audio.addEventListener('play', () => { audio.classList.add('voice-audio-playing'); btn.innerHTML = pauseIconSVG(); });
    audio.addEventListener('pause', () => { audio.classList.remove('voice-audio-playing'); btn.innerHTML = playIconSVG(); });
    audio.addEventListener('ended', () => { progress.style.width = '0%'; time.textContent = knownDuration ? formatDuration(knownDuration) : formatDuration(audio.duration); });
    audio.addEventListener('loadedmetadata', () => { if (!knownDuration && isFinite(audio.duration)) time.textContent = formatDuration(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && isFinite(audio.duration)) {
        progress.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
        time.textContent = formatDuration(Math.floor(audio.currentTime));
      }
    });
    track.addEventListener('click', (e) => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      const rect = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    });

    return outer;
  }

  function buildFileCard(msg){
    const wrap = document.createElement('div');
    wrap.className = 'file-card';

    const icon = document.createElement('div');
    icon.className = 'file-icon';
    icon.innerHTML = fileIconSVG();

    const info = document.createElement('div');
    info.className = 'file-info';
    const nameEl = document.createElement('span');
    nameEl.className = 'file-name';
    nameEl.textContent = msg.fileName || 'File';
    const metaEl = document.createElement('span');
    metaEl.className = 'file-meta';
    const ext = (msg.fileName || '').split('.').pop().toUpperCase().slice(0, 5) || 'FILE';
    metaEl.innerHTML = `<span class="file-badge ${fileBadgeClass(ext)}">${escapeHTML(ext)}</span><span>${formatBytes(msg.fileSize)}</span>`;
    info.appendChild(nameEl); info.appendChild(metaEl);

    const dl = document.createElement('a');
    dl.className = 'file-download';
    dl.href = msg.fileData;
    dl.download = msg.fileName || 'file';
    dl.title = 'Download';
    dl.innerHTML = downloadIconSVG();

    wrap.appendChild(icon); wrap.appendChild(info); wrap.appendChild(dl);
    return wrap;
  }

  function removeMessage(key){
    const bubble = chatBox.querySelector(`.bubble[data-key="${key}"]`);
    if (!bubble) return;
    const stack = bubble.parentElement;
    bubble.remove();
    if (stack && stack.children.length === 0) {
      const group = stack.closest('.msg-group');
      if (group) group.remove();
    }
    if (chatBox.children.length === 0) {
      chatBox.innerHTML = '<div class="empty-state">No messages yet — say something.</div>';
    }
  }

  chatBox.innerHTML = '<div class="empty-state">No messages yet — say something.</div>';

  // =================================================================
  // ======================= VOICE MESSAGES =========================
  // =================================================================

  function pickAudioMime(){
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    for (const c of candidates) { if (MediaRecorder.isTypeSupported(c)) return c; }
    return '';
  }

  micBtn.addEventListener('click', () => { if (!isRecording) startRecording(); });
  recCancelBtn.addEventListener('click', () => stopRecording(false));
  recSendBtn.addEventListener('click', () => stopRecording(true));

  async function startRecording(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast("Voice messages aren't supported in this browser.", 'error');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      toast('Microphone access was blocked. Check your browser permissions.', 'error');
      return;
    }

    recordingStream = stream;
    recordedChunks = [];
    const mime = pickAudioMime();
    try { mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (err) { mediaRecorder = new MediaRecorder(stream); }
    recordingMime = mediaRecorder.mimeType || mime || 'audio/webm';

    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();

    isRecording = true;
    recordingStartTime = Date.now();
    composerEl.classList.add('is-recording');
    recTimerEl.textContent = '0:00';
    recordingTimerInterval = setInterval(updateRecTimer, 250);
  }

  function updateRecTimer(){
    const elapsed = Date.now() - recordingStartTime;
    if (elapsed >= MAX_RECORDING_MS) { stopRecording(true); return; }
    recTimerEl.textContent = formatDuration(elapsed / 1000);
  }

  function stopRecording(shouldSend){
    if (!isRecording) return;
    pendingSend = shouldSend;
    isRecording = false;
    clearInterval(recordingTimerInterval);
    composerEl.classList.remove('is-recording');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (recordingStream) { recordingStream.getTracks().forEach(t => t.stop()); recordingStream = null; }
  }

  async function onRecordingStop(){
    if (!pendingSend || recordedChunks.length === 0) { recordedChunks = []; return; }
    const durationSec = Math.max(1, Math.round((Date.now() - recordingStartTime) / 1000));
    const blob = new Blob(recordedChunks, { type: recordingMime });
    recordedChunks = [];
    try {
      const dataUrl = await blobToDataURL(blob);
      await db.ref('messages').push({
        type: 'voice', username: currentUsername, isAdmin: isAdminUser, timestamp: Date.now(),
        audioData: dataUrl, duration: durationSec
      });
    } catch (err) { toast('Could not send voice message — try again.', 'error'); }
  }

  // =================================================================
  // =============== BROADCAST CHANNEL (screen share + calls) =========
  // =================================================================

  function createBroadcastChannel(config){
    const state = { active: false, localStream: null, peers: {}, peerListenerRefs: {}, watching: {}, watchListenerRefs: {} };

    async function start(){
      if (state.active) return;
      let stream;
      try { stream = await config.getStream(); }
      catch (err) {
        if (!err || err.name !== 'NotAllowedError') toast(config.failMessage || 'Could not start.', 'error');
        return;
      }
      state.localStream = stream;
      state.active = true;
      stream.getTracks().forEach(t => t.addEventListener('ended', stop));
      config.onStart && config.onStart(stream);

      try {
        await db.ref(`${config.liveNode}/${currentKey}`).set({ display: currentUsername, startedAt: Date.now() });
      } catch (err) {
        toast('Could not announce your stream.', 'error');
        stop();
        return;
      }
      db.ref(`${config.liveNode}/${currentKey}`).onDisconnect().remove();
      db.ref(`${config.watchNode}/${currentKey}`).onDisconnect().remove();
      db.ref(`${config.rtcNode}/${currentKey}`).onDisconnect().remove();

      db.ref(`${config.watchNode}/${currentKey}`).on('child_added', snap => createOfferFor(snap.key));
      db.ref(`${config.watchNode}/${currentKey}`).on('child_removed', snap => teardownPeer(snap.key));
      config.onStateChange && config.onStateChange();
    }

    async function createOfferFor(viewerKey){
      if (state.peers[viewerKey] || !state.localStream) return;
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      state.peers[viewerKey] = pc;
      state.localStream.getTracks().forEach(t => pc.addTrack(t, state.localStream));

      pc.onicecandidate = (e) => { if (e.candidate) db.ref(`${config.rtcNode}/${currentKey}/${viewerKey}/candidates/broadcaster`).push(e.candidate.toJSON()); };
      const answerRef = db.ref(`${config.rtcNode}/${currentKey}/${viewerKey}/answer`);
      const answerHandler = (snap) => {
        const v = snap.val();
        if (v && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(v)).catch(() => {});
      };
      answerRef.on('value', answerHandler);
      const candRef = db.ref(`${config.rtcNode}/${currentKey}/${viewerKey}/candidates/viewer`);
      const candHandler = (snap) => { const v = snap.val(); if (v) pc.addIceCandidate(new RTCIceCandidate(v)).catch(() => {}); };
      candRef.on('child_added', candHandler);
      state.peerListenerRefs[viewerKey] = { answerRef, answerHandler, candRef, candHandler };

      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await db.ref(`${config.rtcNode}/${currentKey}/${viewerKey}/offer`).set({ sdp: offer.sdp, type: offer.type });
      } catch (err) { teardownPeer(viewerKey); }
    }

    function teardownPeer(viewerKey){
      const pc = state.peers[viewerKey];
      if (pc) { pc.close(); delete state.peers[viewerKey]; }
      const refs = state.peerListenerRefs[viewerKey];
      if (refs) { refs.answerRef.off('value', refs.answerHandler); refs.candRef.off('child_added', refs.candHandler); delete state.peerListenerRefs[viewerKey]; }
      db.ref(`${config.rtcNode}/${currentKey}/${viewerKey}`).remove();
    }

    function stop(){
      if (!state.active) return;
      state.active = false;
      if (state.localStream) { state.localStream.getTracks().forEach(t => t.stop()); state.localStream = null; }
      config.onStop && config.onStop();
      Object.keys(state.peers).forEach(teardownPeer);
      db.ref(`${config.watchNode}/${currentKey}`).off();
      db.ref(`${config.watchNode}/${currentKey}`).remove();
      db.ref(`${config.liveNode}/${currentKey}`).remove();
      db.ref(`${config.rtcNode}/${currentKey}`).remove();
      config.onStateChange && config.onStateChange();
    }

    async function watchPeer(broadcasterKey, displayName){
      if (state.watching[broadcasterKey]) return;
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      state.watching[broadcasterKey] = pc;
      config.onWatchStart && config.onWatchStart(broadcasterKey, displayName, pc);

      pc.onicecandidate = (e) => { if (e.candidate) db.ref(`${config.rtcNode}/${broadcasterKey}/${currentKey}/candidates/viewer`).push(e.candidate.toJSON()); };

      try { await db.ref(`${config.watchNode}/${broadcasterKey}/${currentKey}`).set(true); }
      catch (err) { toast('Could not connect to that stream.', 'error'); stopWatchingPeer(broadcasterKey); return; }
      db.ref(`${config.watchNode}/${broadcasterKey}/${currentKey}`).onDisconnect().remove();

      const offerRef = db.ref(`${config.rtcNode}/${broadcasterKey}/${currentKey}/offer`);
      const offerHandler = async (snap) => {
        const v = snap.val();
        if (v && !pc.currentRemoteDescription) {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(v));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            await db.ref(`${config.rtcNode}/${broadcasterKey}/${currentKey}/answer`).set({ sdp: answer.sdp, type: answer.type });
          } catch (err) { /* ignore transient signaling errors */ }
        }
      };
      offerRef.on('value', offerHandler);
      const candRef = db.ref(`${config.rtcNode}/${broadcasterKey}/${currentKey}/candidates/broadcaster`);
      const candHandler = (snap) => { const v = snap.val(); if (v) pc.addIceCandidate(new RTCIceCandidate(v)).catch(() => {}); };
      candRef.on('child_added', candHandler);

      state.watchListenerRefs[broadcasterKey] = { offerRef, offerHandler, candRef, candHandler };
    }

    function stopWatchingPeer(broadcasterKey){
      const pc = state.watching[broadcasterKey];
      if (pc) { pc.close(); delete state.watching[broadcasterKey]; }
      const refs = state.watchListenerRefs[broadcasterKey];
      if (refs) { refs.offerRef.off('value', refs.offerHandler); refs.candRef.off('child_added', refs.candHandler); delete state.watchListenerRefs[broadcasterKey]; }
      db.ref(`${config.watchNode}/${broadcasterKey}/${currentKey}`).off();
      db.ref(`${config.watchNode}/${broadcasterKey}/${currentKey}`).remove();
      db.ref(`${config.rtcNode}/${broadcasterKey}/${currentKey}`).remove();
      config.onWatchStop && config.onWatchStop(broadcasterKey);
    }

    function listenLive(){
      db.ref(config.liveNode).on('value', snap => {
        const items = {};
        snap.forEach(child => { items[child.key] = child.val(); return false; });
        config.onLiveChange && config.onLiveChange(items);
      });
      db.ref(config.liveNode).on('child_removed', snap => {
        if (state.watching[snap.key]) stopWatchingPeer(snap.key);
      });
    }

    function cleanupAll(){
      if (state.active) stop();
      Object.keys(state.watching).forEach(stopWatchingPeer);
    }

    return { start, stop, watchPeer, stopWatchingPeer, listenLive, cleanupAll, state };
  }

  function createTile(uniqueKey, label, isSelf, kind){
    let tile = streamStrip.querySelector(`.stream-tile[data-key="${uniqueKey}"]`);
    if (tile) return tile;
    tile = document.createElement('div');
    tile.className = 'stream-tile' + (isSelf ? ' is-self' : '');
    tile.dataset.key = uniqueKey;

    let controlsHtml = '';
    if (kind === 'call' && isSelf) {
      controlsHtml = '<div class="tile-controls">' +
        '<button type="button" class="tile-ctrl mic-ctrl" title="Mute microphone">' + micOnIconSVG() + '</button>' +
        '<button type="button" class="tile-ctrl cam-ctrl" title="Turn off camera">' + camOnIconSVG() + '</button>' +
      '</div>';
    }

    tile.innerHTML =
      '<video autoplay playsinline' + (isSelf ? ' muted' : '') + '></video>' +
      '<div class="tile-label"><span class="live-dot-sm"></span>' + escapeHTML(label) + '</div>' +
      controlsHtml +
      '<button type="button" class="tile-expand" title="Fullscreen">' + expandIconSVG() + '</button>' +
      '<button type="button" class="tile-close" title="' + (isSelf ? 'Stop' : 'Stop watching') + '">' + closeIconSVG() + '</button>';

    tile.querySelector('.tile-expand').addEventListener('click', () => {
      const video = tile.querySelector('video');
      if (video.requestFullscreen) video.requestFullscreen().catch(() => toast('Fullscreen not available.', 'error'));
      else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
      else toast('Fullscreen is not supported in this browser.', 'error');
    });

    streamStrip.appendChild(tile);
    streamStrip.style.display = 'flex';
    return tile;
  }
  function removeTile(uniqueKey){
    const tile = streamStrip.querySelector(`.stream-tile[data-key="${uniqueKey}"]`);
    if (tile) tile.remove();
    if (!streamStrip.children.length) streamStrip.style.display = 'none';
  }
  function attachRemoteTrack(tile, pc){
    pc.ontrack = (e) => {
      const video = tile.querySelector('video');
      if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    };
  }

  const screenChannel = createBroadcastChannel({
    liveNode: 'screenShares', watchNode: 'watchScreen', rtcNode: 'rtcScreen',
    getStream: () => navigator.mediaDevices.getDisplayMedia({ video: true, audio: true }),
    failMessage: "Your browser doesn't support screen sharing.",
    onStart: (stream) => {
      const tile = createTile('screen:' + currentKey, 'You', true, 'screen');
      tile.querySelector('video').srcObject = stream;
      tile.querySelector('.tile-close').addEventListener('click', () => screenChannel.stop());
    },
    onStop: () => removeTile('screen:' + currentKey),
    onStateChange: () => {
      shareToggleBtn.classList.toggle('is-live', screenChannel.state.active);
      shareToggleBtn.title = screenChannel.state.active ? 'Stop sharing your screen' : 'Share your screen';
    },
    onWatchStart: (key, name, pc) => {
      const tile = createTile('screen:' + key, name, false, 'screen');
      tile.querySelector('.tile-close').addEventListener('click', () => screenChannel.stopWatchingPeer(key));
      attachRemoteTrack(tile, pc);
    },
    onWatchStop: (key) => removeTile('screen:' + key),
    onLiveChange: (items) => { liveScreens = items; renderLivePanel(); updateHeaderSubtitle(); }
  });

  const callChannel = createBroadcastChannel({
    liveNode: 'calls', watchNode: 'watchCall', rtcNode: 'rtcCall',
    getStream: () => navigator.mediaDevices.getUserMedia({ video: true, audio: true }),
    failMessage: "Camera or microphone access isn't available.",
    onStart: (stream) => {
      const tile = createTile('call:' + currentKey, 'You', true, 'call');
      tile.querySelector('video').srcObject = stream;
      tile.querySelector('.tile-close').addEventListener('click', () => callChannel.stop());
      const micCtrl = tile.querySelector('.mic-ctrl');
      const camCtrl = tile.querySelector('.cam-ctrl');
      micCtrl.addEventListener('click', () => {
        const track = stream.getAudioTracks()[0];
        if (!track) return;
        track.enabled = !track.enabled;
        micCtrl.classList.toggle('muted', !track.enabled);
        micCtrl.innerHTML = track.enabled ? micOnIconSVG() : micOffIconSVG();
      });
      camCtrl.addEventListener('click', () => {
        const track = stream.getVideoTracks()[0];
        if (!track) return;
        track.enabled = !track.enabled;
        camCtrl.classList.toggle('muted', !track.enabled);
        camCtrl.innerHTML = track.enabled ? camOnIconSVG() : camOffIconSVG();
      });
    },
    onStop: () => removeTile('call:' + currentKey),
    onStateChange: () => {
      callToggleBtn.classList.toggle('is-live', callChannel.state.active);
      callToggleBtn.title = callChannel.state.active ? 'Leave the call' : 'Start a call';
    },
    onWatchStart: (key, name, pc) => {
      const tile = createTile('call:' + key, name, false, 'call');
      tile.querySelector('.tile-close').addEventListener('click', () => callChannel.stopWatchingPeer(key));
      attachRemoteTrack(tile, pc);
    },
    onWatchStop: (key) => removeTile('call:' + key),
    onLiveChange: (items) => { liveCalls = items; renderLivePanel(); updateHeaderSubtitle(); }
  });

  shareToggleBtn.addEventListener('click', () => { if (screenChannel.state.active) screenChannel.stop(); else screenChannel.start(); });
  callToggleBtn.addEventListener('click', () => { if (callChannel.state.active) callChannel.stop(); else callChannel.start(); });

  function renderLivePanel(){
    const rows = [];
    Object.keys(liveScreens).forEach(key => rows.push({ key, kind: 'screen', display: liveScreens[key].display }));
    Object.keys(liveCalls).forEach(key => rows.push({ key, kind: 'call', display: liveCalls[key].display }));

    liveSection.style.display = rows.length ? 'block' : 'none';
    liveList.innerHTML = rows.map(r => {
      const isSelf = r.key === currentKey;
      const channel = r.kind === 'screen' ? screenChannel : callChannel;
      const isWatching = !!channel.state.watching[r.key];
      const icon = r.kind === 'screen' ? monitorMiniSVG() : phoneMiniSVG();
      return '<div class="user-row live-row">' +
        '<span class="live-dot-sm"></span>' + icon +
        '<span class="user-row-name">' + escapeHTML(r.display) + (isSelf ? ' (you)' : '') + '</span>' +
        (isSelf ? '' : '<button type="button" class="watch-btn' + (isWatching ? ' watching' : '') + '" data-key="' + r.key + '" data-kind="' + r.kind + '" data-name="' + escapeHTML(r.display) + '">' + (isWatching ? 'Stop' : 'Watch') + '</button>') +
      '</div>';
    }).join('');

    liveList.querySelectorAll('.watch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key, kind = btn.dataset.kind, name = btn.dataset.name;
        const channel = kind === 'screen' ? screenChannel : callChannel;
        if (channel.state.watching[key]) channel.stopWatchingPeer(key); else channel.watchPeer(key, name);
      });
    });
  }

  // =================================================================
  // ========================= SETTINGS =================================
  // =================================================================

  const WALLPAPER_PRESETS = [
    { id: 'none', label: 'None', css: null },
    { id: 'aurora', label: 'Aurora', css: 'radial-gradient(circle at 20% 20%, rgba(52,224,161,0.28), transparent 45%), radial-gradient(circle at 80% 30%, rgba(124,111,238,0.3), transparent 50%), radial-gradient(circle at 50% 90%, rgba(91,110,232,0.22), transparent 55%)' },
    { id: 'sunset', label: 'Sunset', css: 'radial-gradient(circle at 30% 20%, rgba(255,92,114,0.25), transparent 50%), radial-gradient(circle at 75% 75%, rgba(242,183,5,0.2), transparent 55%)' },
    { id: 'forest', label: 'Forest', css: 'radial-gradient(circle at 25% 30%, rgba(52,224,161,0.25), transparent 50%), radial-gradient(circle at 70% 70%, rgba(34,140,105,0.32), transparent 55%)' },
    { id: 'midnight', label: 'Midnight', css: 'radial-gradient(circle at 60% 20%, rgba(124,111,238,0.25), transparent 50%), radial-gradient(circle at 20% 80%, rgba(91,110,232,0.2), transparent 55%)' }
  ];

  let settingsInitialized = false;
  function initSettingsModal(){
    if (settingsInitialized) return;
    settingsInitialized = true;

    settingsBtn.addEventListener('click', () => { populateSettingsModal(); openModal(); });
    modalCloseBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
    modalTabButtons.forEach(btn => btn.addEventListener('click', () => switchModalTab(btn.dataset.tab)));

    avatarUploadBtn.addEventListener('click', () => avatarFileInput.click());
    avatarFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      avatarFileInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please choose an image file.', 'error'); return; }
      if (file.size > MAX_FILE_BYTES) { toast('Images must be under 5MB.', 'error'); return; }
      try {
        const dataUrl = await compressImage(file, 256, 0.85, true);
        await db.ref('profiles/' + currentKey).update({ avatarData: dataUrl });
        profilesCache[currentKey] = Object.assign({}, profilesCache[currentKey], { avatarData: dataUrl });
        refreshAllAvatars();
        populateSettingsModal();
        toast('Profile photo updated.');
      } catch (err) { toast('Could not update your photo.', 'error'); }
    });
    avatarRemoveBtn.addEventListener('click', async () => {
      try {
        await db.ref('profiles/' + currentKey + '/avatarData').remove();
        if (profilesCache[currentKey]) delete profilesCache[currentKey].avatarData;
        refreshAllAvatars();
        populateSettingsModal();
      } catch (err) { toast('Could not remove your photo.', 'error'); }
    });

    wallpaperUploadBtn.addEventListener('click', () => wallpaperFileInput.click());
    wallpaperFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      wallpaperFileInput.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) { toast('Please choose an image file.', 'error'); return; }
      if (file.size > MAX_FILE_BYTES) { toast('Images must be under 5MB.', 'error'); return; }
      try {
        const dataUrl = await compressImage(file, 1600, 0.8, true);
        const blur = wallpaperBlurToggle.checked;
        await db.ref('profiles/' + currentKey).update({ wallpaperImage: dataUrl, wallpaperPreset: null, wallpaperBlur: blur });
        profilesCache[currentKey] = Object.assign({}, profilesCache[currentKey], { wallpaperImage: dataUrl, wallpaperPreset: null, wallpaperBlur: blur });
        applyOwnWallpaper();
        populateSettingsModal();
      } catch (err) { toast('Could not set that wallpaper.', 'error'); }
    });

    wallpaperBlurToggle.addEventListener('change', () => {
      const blur = wallpaperBlurToggle.checked;
      db.ref('profiles/' + currentKey + '/wallpaperBlur').set(blur);
      profilesCache[currentKey] = Object.assign({}, profilesCache[currentKey], { wallpaperBlur: blur });
      applyOwnWallpaper();
    });
  }

  function openModal(){ modalOverlay.classList.add('open'); }
  function closeModal(){ modalOverlay.classList.remove('open'); }

  function switchModalTab(tab){
    modalTabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    modalSections.forEach(s => s.classList.toggle('active', s.dataset.section === tab));
  }

  function populateSettingsModal(){
    const profile = profilesCache[currentKey] || {};
    avatarPreview.dataset.avatarKey = currentKey;
    avatarPreview.dataset.avatarName = currentUsername;
    applyAvatarVisual(avatarPreview);
    avatarRemoveBtn.style.display = profile.avatarData ? 'inline-flex' : 'none';

    wallpaperBlurToggle.checked = profile.wallpaperBlur !== false;
    renderWallpaperGrid(profile);
  }

  function renderWallpaperGrid(profile){
    const selectedId = profile.wallpaperImage ? 'custom' : (profile.wallpaperPreset || 'none');
    let html = WALLPAPER_PRESETS.map(p => {
      if (p.id === 'none') return `<div class="wallpaper-swatch none-swatch${selectedId === 'none' ? ' selected' : ''}" data-preset="none">None</div>`;
      return `<div class="wallpaper-swatch${selectedId === p.id ? ' selected' : ''}" data-preset="${p.id}" style="background-image:${p.css}">` +
        `<span class="swatch-label">${escapeHTML(p.label)}</span></div>`;
    }).join('');
    if (profile.wallpaperImage) {
      html += `<div class="wallpaper-swatch selected" style="background-image:url('${profile.wallpaperImage}');background-size:cover;background-position:center;"><span class="swatch-label">Custom</span></div>`;
    }
    wallpaperGrid.innerHTML = html;

    wallpaperGrid.querySelectorAll('.wallpaper-swatch[data-preset]').forEach(el => {
      el.addEventListener('click', async () => {
        const presetId = el.dataset.preset;
        const blur = wallpaperBlurToggle.checked;
        const updates = { wallpaperImage: null, wallpaperPreset: presetId === 'none' ? null : presetId, wallpaperBlur: blur };
        try {
          await db.ref('profiles/' + currentKey).update(updates);
          profilesCache[currentKey] = Object.assign({}, profilesCache[currentKey], updates);
          applyOwnWallpaper();
          populateSettingsModal();
        } catch (err) { toast('Could not update wallpaper.', 'error'); }
      });
    });
  }

  function applyOwnWallpaper(){
    const profile = profilesCache[currentKey] || {};
    let value = null;
    if (profile.wallpaperImage) value = `url('${profile.wallpaperImage}')`;
    else if (profile.wallpaperPreset) { const p = WALLPAPER_PRESETS.find(x => x.id === profile.wallpaperPreset); if (p) value = p.css; }
    if (!value) { wallpaperLayer.style.backgroundImage = 'none'; return; }
    wallpaperLayer.style.backgroundImage = value;
    wallpaperLayer.style.filter = (profile.wallpaperBlur !== false) ? 'blur(14px)' : 'none';
  }
</script>
