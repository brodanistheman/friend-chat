<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurora — Live Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --sidebar-bg:#0d1016;
    --panel-bg:#0f1218;
    --surface:#161a22;
    --surface-hover:#1c212b;
    --inset:#0b0d13;
    --border:#20252f;
    --border-strong:#2b3140;
    --text-1:#edeff3;
    --text-2:#8d93a3;
    --text-3:#565c6d;
    --accent-1:#34e0a1;
    --accent-2:#7c6fee;
    --accent-solid:#5b6ee8;
    --accent-solid-hover:#6c7ded;
    --red:#ff5c72;
    --red-bg:rgba(255,92,114,0.12);
    --amber:#f2b705;
    --amber-bg:rgba(242,183,5,0.12);
    --r-xs:6px;
    --r-sm:10px;
    --r-md:14px;
    --r-lg:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text-1);
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 900px 500px at 50% -8%, rgba(124,111,238,0.12), transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .aurora-ribbon{
    position:fixed;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,var(--accent-1),var(--accent-2),var(--accent-1));
    background-size:200% 100%;
    animation:shimmer 9s linear infinite;
    z-index:100;
  }
  @keyframes shimmer{
    0%{background-position:0% 0;}
    100%{background-position:200% 0;}
  }
  ::selection{background:rgba(91,110,232,0.35);}
  svg{display:block;}
  button{font-family:inherit;}
  textarea, input{font-family:inherit;}

  /* ---------- shared controls ---------- */
  .field{
    width:100%;
    background:var(--inset);
    border:1.5px solid var(--border);
    border-radius:var(--r-sm);
    color:var(--text-1);
    font-family:inherit;
    font-size:0.95rem;
    font-weight:500;
    padding:12px 14px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field::placeholder{color:var(--text-3);}
  .field:focus{
    border-color:var(--accent-solid);
    box-shadow:0 0 0 3px rgba(91,110,232,0.18);
  }
  .btn{
    appearance:none;-webkit-appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.95);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{
    background:var(--accent-solid);
    border-radius:var(--r-sm);
    padding:12px 18px;
    font-size:0.94rem;
  }
  .btn-primary:not(:disabled):hover{background:var(--accent-solid-hover);}
  .btn-round{
    width:40px;height:40px;
    border-radius:50%;
    flex-shrink:0;
    padding:0;
  }
  .btn-secondary{
    appearance:none;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--text-1);
    font-family:inherit;font-weight:600;font-size:0.82rem;
    padding:9px 14px;border-radius:var(--r-xs);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:background .15s ease;
  }
  .btn-secondary:hover{background:var(--surface-hover);}
  .btn-secondary.danger{color:var(--red);border-color:rgba(255,92,114,0.35);}
  .icon-btn{
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--r-xs);
    width:36px;height:36px;
    color:var(--text-2);
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-hover);color:var(--text-1);}
  .icon-btn.danger:hover{color:var(--red);background:var(--red-bg);}
  .icon-btn.is-live{color:var(--red);background:var(--red-bg);border-color:rgba(255,92,114,0.35);}
  .icon-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .icon-btn:disabled:hover{background:transparent;color:var(--text-2);}
  :focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px;}

  /* ---------- app shell ---------- */
  #app{position:relative;z-index:1;height:100dvh;width:100%;}
  .screen{height:100%;width:100%;}

  /* ---------- username screen ---------- */
  #screen-username{
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .auth-card{
    width:100%;
    max-width:400px;
    background:var(--panel-bg);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:36px 32px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
  }
  .brand-mark{
    width:46px;height:46px;
    border-radius:var(--r-sm);
    background:var(--surface);
    border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .brand-mark svg{width:24px;height:24px;}
  .auth-card h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  .auth-card p{
    font-size:0.92rem;
    color:var(--text-2);
    margin-bottom:26px;
    line-height:1.55;
  }
  .field-wrap{position:relative;margin-bottom:6px;}
  .field-wrap .field{padding-right:42px;}
  .field-status{
    position:absolute;
    right:12px;top:50%;
    transform:translateY(-50%);
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .field-status .spinner{
    width:15px;height:15px;
    border:2px solid rgba(255,255,255,0.12);
    border-top-color:var(--text-2);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{
    min-height:18px;
    font-size:0.78rem;
    font-weight:500;
    margin:8px 2px 20px;
    display:flex;align-items:center;gap:6px;
  }
  .hint.ok{color:var(--accent-1);}
  .hint.bad{color:var(--red);}
  .hint.muted{color:var(--text-3);}
  .shake{animation:shake .35s;}
  @keyframes shake{
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  /* ---------- chat screen shell (full-bleed) ---------- */
  #screen-chat{
    display:flex;
    height:100%;
    width:100%;
  }
  #drawer-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    z-index:39;
  }
  #drawer-overlay.open{display:block;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-brand{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .sidebar-brand .brand-mark{width:32px;height:32px;margin:0;border-radius:9px;}
  .sidebar-brand .brand-mark svg{width:17px;height:17px;}
  .sidebar-brand .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:-0.01em;
  }
  .sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
  }
  .sidebar-scroll::-webkit-scrollbar{width:5px;}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  .sidebar-section{margin-bottom:18px;}
  .sidebar-heading{
    display:flex;align-items:center;gap:6px;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-3);
    padding:0 8px 8px;
  }
  .sidebar-heading .count-badge{
    background:var(--surface);
    color:var(--text-2);
    border-radius:999px;
    font-size:0.65rem;
    padding:1px 6px;
    font-weight:700;
  }
  .live-dot-sm{
    width:6px;height:6px;border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    box-shadow:0 0 0 3px var(--red-bg);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  .online-dot-sm{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent-1);
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(52,224,161,0.15);
  }
  @keyframes pulseDot{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .user-list{display:flex;flex-direction:column;gap:1px;}
  .user-row{
    display:flex;align-items:center;gap:9px;
    padding:7px 8px;
    border-radius:var(--r-xs);
    font-size:0.85rem;
    font-weight:500;
    color:var(--text-1);
  }
  .user-row.is-self{background:var(--surface);}
  .mini-avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.6rem;font-weight:700;color:#0a0c11;
    flex-shrink:0;
    overflow:hidden;
    background-size:cover;background-position:center;
  }
  .user-row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .you-tag{font-size:0.68rem;font-weight:600;color:var(--text-3);}
  .tag{
    font-size:0.6rem;font-weight:700;letter-spacing:0.03em;
    color:var(--amber);
    background:var(--amber-bg);
    border:1px solid rgba(242,183,5,0.35);
    padding:2px 6px;border-radius:5px;
    flex-shrink:0;
  }
  .live-row{padding:7px 8px;}
  .live-row svg{flex-shrink:0;color:var(--text-2);}
  .watch-btn{
    appearance:none;border:1px solid var(--border-strong);
    background:transparent;color:var(--text-2);
    font-family:inherit;font-size:0.72rem;font-weight:700;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    flex-shrink:0;
    transition:all .15s ease;
  }
  .watch-btn:hover{border-color:var(--accent-solid);color:var(--text-1);}
  .watch-btn.watching{background:var(--red-bg);border-color:rgba(255,92,114,0.4);color:var(--red);}

  .sidebar-footer{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;align-items:center;gap:8px;
    flex-shrink:0;
  }
  .self-pill{
    flex:1;min-width:0;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px 5px 5px;
    font-size:0.82rem;font-weight:600;
  }
  .self-pill .mini-avatar{width:26px;height:26px;font-size:0.64rem;}
  #self-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- main panel ---------- */
  #main-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--panel-bg);
  }
  .chat-header{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #menu-btn{display:none;}
  .header-title{flex:1;min-width:0;}
  .header-title h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.02rem;font-weight:700;letter-spacing:-0.01em;
  }
  .header-title p{
    font-size:0.76rem;color:var(--text-2);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .header-actions{display:flex;align-items:center;gap:4px;}

  /* ---------- stream strip ---------- */
  #stream-strip{
    display:none;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    flex-shrink:0;
    background:var(--inset);
  }
  #stream-strip::-webkit-scrollbar{height:5px;}
  #stream-strip::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  .stream-tile{
    position:relative;
    flex-shrink:0;
    width:230px;height:150px;
    background:#000;
    border-radius:var(--r-sm);
    overflow:hidden;
    border:1px solid var(--border-strong);
  }
  .stream-tile video{
    width:100%;height:100%;
    object-fit:contain;
    background:#000;
  }
  .stream-tile.is-self{border-color:rgba(91,110,232,0.5);}
  .tile-label{
    position:absolute;left:8px;bottom:8px;
    display:flex;align-items:center;gap:6px;
    background:rgba(10,12,17,0.72);
    backdrop-filter:blur(6px);
    padding:4px 9px;
    border-radius:999px;
    font-size:0.72rem;font-weight:600;
    max-width:calc(100% - 50px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .stream-tile[data-key^="call:"] .tile-label{display:none;}
  .tile-controls{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;}
  .tile-ctrl{
    width:28px;height:28px;border-radius:50%;
    background:rgba(10,12,17,0.72);backdrop-filter:blur(6px);
    border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .tile-ctrl.muted{background:var(--red);}
  .tile-expand{
    position:absolute;top:6px;right:36px;
    width:24px;height:24px;border-radius:50%;
    background:rgba(10,12,17,0.72);backdrop-filter:blur(6px);
    border:none;color:var(--text-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .tile-expand:hover{color:var(--text-1);}
  .tile-close{
    position:absolute;top:6px;right:6px;
    width:24px;height:24px;
    border-radius:50%;
    background:rgba(10,12,17,0.72);
    backdrop-filter:blur(6px);
    border:none;
    color:var(--text-2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tile-close:hover{color:var(--red);}

  /* ---------- messages + wallpaper ---------- */
  #chat-box-wrapper{position:relative;flex:1;overflow:hidden;display:flex;}
  #wallpaper-layer{
    position:absolute;inset:-24px;
    background-repeat:no-repeat;background-size:cover;background-position:center;
    background-color:var(--inset);
    transition:filter .2s ease;
    pointer-events:none;
    z-index:0;
  }
  #chat-box{
    position:relative;z-index:1;
    flex:1;
    overflow-y:auto;
    padding:18px 18px 4px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  #chat-box::-webkit-scrollbar{width:6px;}
  #chat-box::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  #chat-box::-webkit-scrollbar-track{background:transparent;}

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-3);
    font-size:0.86rem;
    font-weight:500;
    padding:40px 20px;
  }

  .msg-group{
    display:flex;
    gap:10px;
    max-width:78%;
    animation:riseIn .22s ease both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .msg-group.own{align-self:flex-end;flex-direction:row-reverse;}
  .msg-group .avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.64rem;font-weight:700;color:#0a0c11;
    flex-shrink:0;
    margin-top:2px;
    overflow:hidden;
    background-size:cover;background-position:center;
  }
  .group-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg-group.own .group-body{align-items:flex-end;}
  .group-meta{
    display:flex;align-items:center;gap:6px;
    font-size:0.75rem;font-weight:600;color:var(--text-2);
    padding:0 2px;
  }
  .group-time{font-weight:500;color:var(--text-3);}
  .bubble-stack{display:flex;flex-direction:column;gap:3px;}
  .msg-group.own .bubble-stack{align-items:flex-end;}

  .bubble{
    position:relative;
    padding:9px 13px;
    font-size:0.9rem;
    font-weight:400;
    line-height:1.45;
    word-wrap:break-word;
    max-width:100%;
    border-radius:var(--r-sm);
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-1);
  }
  .msg-group.own .bubble{
    background:var(--accent-solid);
    border:none;
    color:#fff;
  }
  .msg-group.admin-sender .bubble{border-left:2.5px solid var(--amber);}
  .msg-group.own.admin-sender .bubble{border-left:2.5px solid rgba(255,255,255,0.5);}
  .msg-link{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,0.4);word-break:break-all;}
  .msg-group:not(.own) .msg-link{color:var(--accent-solid);text-decoration-color:rgba(91,110,232,0.4);}

  .bubble-delete, .bubble-react{
    position:absolute;
    top:-8px;
    background:var(--panel-bg);
    border:1px solid var(--border-strong);
    border-radius:50%;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease,color .15s ease;
  }
  .msg-group.own .bubble-delete{left:-8px;}
  .msg-group:not(.own) .bubble-delete{right:-8px;}
  .msg-group.own .bubble-react{right:-8px;}
  .msg-group:not(.own) .bubble-react{left:-8px;}
  .bubble:hover .bubble-delete,
  .bubble:hover .bubble-react{opacity:1;}
  .bubble-delete:hover{color:var(--red);}
  .bubble-react:hover{color:var(--accent-1);}

  .reactions-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .reaction-pill{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--surface-hover);border:1px solid var(--border-strong);
    border-radius:999px;padding:2px 8px;
    font-size:0.76rem;font-weight:600;color:var(--text-2);cursor:pointer;
  }
  .reaction-pill:hover{border-color:var(--accent-solid);}
  .reaction-pill.mine{background:rgba(91,110,232,0.18);border-color:var(--accent-solid);color:var(--text-1);}
  .reaction-count{font-variant-numeric:tabular-nums;}

  /* voice / audio player */
  .bubble-voice{padding:8px 12px;min-width:200px;}
  .audio-file-label{font-size:0.76rem;font-weight:600;color:inherit;opacity:0.85;margin-bottom:5px;}
  .voice-msg{display:flex;align-items:center;gap:9px;}
  .voice-play-btn{
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:none;color:inherit;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:background .15s ease;
  }
  .msg-group:not(.own) .voice-play-btn{background:rgba(255,255,255,0.08);}
  .voice-play-btn:hover{background:rgba(255,255,255,0.22);}
  .voice-track{
    flex:1;height:5px;border-radius:99px;
    background:rgba(255,255,255,0.18);
    cursor:pointer;position:relative;
    min-width:70px;
  }
  .msg-group:not(.own) .voice-track{background:rgba(255,255,255,0.1);}
  .voice-progress{
    position:absolute;left:0;top:0;bottom:0;
    width:0%;border-radius:99px;
    background:#fff;
  }
  .msg-group:not(.own) .voice-progress{background:var(--accent-solid);}
  .voice-time{
    font-size:0.72rem;font-weight:600;
    font-variant-numeric:tabular-nums;
    color:inherit;opacity:0.85;
    flex-shrink:0;
  }

  /* image / video messages */
  .bubble-media{padding:4px;}
  .image-msg{max-width:260px;border-radius:calc(var(--r-sm) - 2px);overflow:hidden;cursor:pointer;display:block;}
  .image-msg img{display:block;width:100%;height:auto;max-height:320px;object-fit:cover;}
  .video-msg{max-width:280px;border-radius:calc(var(--r-sm) - 2px);overflow:hidden;}
  .video-msg video{display:block;width:100%;max-height:320px;background:#000;}

  /* file card */
  .file-card{display:flex;align-items:center;gap:10px;min-width:220px;}
  .file-icon{
    width:36px;height:36px;border-radius:var(--r-xs);
    background:rgba(255,255,255,0.1);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:inherit;
  }
  .msg-group:not(.own) .file-icon{background:var(--surface-hover);}
  .file-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .file-name{font-size:0.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-meta{display:flex;align-items:center;gap:6px;font-size:0.72rem;opacity:0.8;}
  .file-badge{font-weight:700;letter-spacing:0.02em;padding:1px 5px;border-radius:4px;font-size:0.65rem;}
  .badge-red{color:var(--red);background:var(--red-bg);}
  .badge-amber{color:var(--amber);background:var(--amber-bg);}
  .badge-blue{color:#fff;background:rgba(255,255,255,0.16);}
  .badge-green{color:var(--accent-1);background:rgba(52,224,161,0.14);}
  .badge-violet{color:var(--accent-2);background:rgba(124,111,238,0.18);}
  .badge-neutral{color:inherit;background:rgba(255,255,255,0.12);}
  .file-download{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:rgba(255,255,255,0.12);color:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .file-download:hover{background:rgba(255,255,255,0.22);}

  /* link embeds */
  .embed-video-frame{position:relative;width:100%;max-width:320px;aspect-ratio:16/9;border-radius:var(--r-sm);overflow:hidden;margin-top:8px;border:1px solid var(--border);background:#000;}
  .embed-video-frame iframe{width:100%;height:100%;}
  .embed-audio-frame{width:100%;max-width:320px;height:152px;border-radius:var(--r-sm);overflow:hidden;margin-top:8px;}
  .embed-audio-frame iframe{width:100%;height:100%;}
  .embed-image{margin-top:8px;max-width:260px;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;border:1px solid var(--border);}
  .embed-image img{display:block;width:100%;height:auto;}

  #typing-row{
    height:20px;
    padding:0 20px 4px;
    display:flex;align-items:center;gap:8px;
    font-size:0.76rem;font-weight:500;color:var(--text-3);
    flex-shrink:0;
  }
  .typing-dots{display:flex;gap:3px;}
  .typing-dots span{
    width:4px;height:4px;border-radius:50%;
    background:var(--text-3);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-3px);opacity:1;}
  }

  /* ---------- composer ---------- */
  #composer{
    display:flex;
    align-items:flex-end;
    gap:6px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    flex-shrink:0;
  }
  .input-wrap{position:relative;flex:1;display:flex;}
  #message-input{
    flex:1;
    resize:none;
    max-height:110px;
    min-height:40px;
    line-height:1.4;
    font-size:0.92rem;
    padding:10px 14px;
    border-radius:20px;
  }
  #composer.is-recording .field,
  #composer.is-recording #mic-btn,
  #composer.is-recording #send-btn{display:none;}
  #recording-ui{
    display:none;
    flex:1;
    align-items:center;gap:10px;
    background:var(--inset);
    border:1.5px solid rgba(255,92,114,0.35);
    border-radius:20px;
    padding:6px 8px 6px 16px;
    min-height:40px;
  }
  #composer.is-recording #recording-ui{display:flex;}
  .rec-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    animation:pulseDot 1.1s ease-in-out infinite;
  }
  #rec-timer{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:0.88rem;
    font-variant-numeric:tabular-nums;
    color:var(--text-1);
  }
  .rec-hint{font-size:0.8rem;color:var(--text-2);flex:1;}
  .rec-actions{display:flex;align-items:center;gap:6px;}
  .rec-actions .btn-round{width:32px;height:32px;}
  .rec-actions .icon-btn{width:32px;height:32px;}

  /* emoji autocomplete (anchored to input) */
  .emoji-autocomplete{
    position:absolute;left:0;bottom:calc(100% + 8px);width:220px;
    background:var(--panel-bg);border:1px solid var(--border-strong);
    border-radius:var(--r-sm);box-shadow:0 20px 50px -18px rgba(0,0,0,.7);
    overflow:hidden;z-index:15;display:none;
  }
  .ac-row{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-size:0.85rem;}
  .ac-row.active,.ac-row:hover{background:var(--surface-hover);}
  .ac-emoji{font-size:1.05rem;}
  .ac-code{color:var(--text-2);font-weight:500;}

  /* floating emoji picker (composer + reactions) */
  .emoji-picker-popover{
    position:fixed;z-index:130;width:264px;max-height:280px;overflow-y:auto;
    background:var(--panel-bg);border:1px solid var(--border-strong);
    border-radius:var(--r-md);box-shadow:0 24px 60px -20px rgba(0,0,0,.7);
    padding:10px;
  }
  .emoji-group-label{font-size:0.68rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--text-3);padding:6px 4px 4px;}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .emoji-cell{appearance:none;border:none;background:transparent;font-size:1.2rem;line-height:1;padding:6px 0;border-radius:6px;cursor:pointer;}
  .emoji-cell:hover{background:var(--surface-hover);}

  /* ---------- toasts ---------- */
  #toast-stack{
    position:fixed;
    bottom:20px;right:20px;
    display:flex;flex-direction:column;gap:8px;
    z-index:110;
    max-width:320px;
  }
  .toast{
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-left:3px solid var(--accent-solid);
    border-radius:var(--r-xs);
    padding:11px 14px;
    font-size:0.83rem;font-weight:500;
    color:var(--text-1);
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast-error{border-left-color:var(--red);}

  /* ---------- lightbox ---------- */
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(5,6,10,0.92);z-index:120;
    display:flex;align-items:center;justify-content:center;padding:40px;
    animation:fadeIn .15s ease;
  }
  .lightbox-overlay img{max-width:100%;max-height:100%;border-radius:var(--r-sm);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);}
  .lightbox-close{
    position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:50%;
    background:var(--surface);border:1px solid var(--border-strong);color:var(--text-1);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .lightbox-caption{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:var(--text-2);font-size:.85rem;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

  /* ---------- settings modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;background:rgba(5,6,10,0.75);z-index:125;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{
    width:100%;max-width:440px;max-height:min(620px,86vh);
    background:var(--panel-bg);border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:0 40px 90px -30px rgba(0,0,0,.75);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .modal-header h2{font-family:'Space Grotesk',sans-serif;font-size:1.02rem;font-weight:700;}
  .modal-tabs{display:flex;gap:16px;padding:12px 18px 0;flex-shrink:0;}
  .modal-tab{appearance:none;border:none;background:transparent;color:var(--text-2);font-family:inherit;font-weight:600;font-size:0.85rem;padding:8px 2px;cursor:pointer;border-bottom:2px solid transparent;}
  .modal-tab.active{color:var(--text-1);border-bottom-color:var(--accent-solid);}
  .modal-body{padding:18px;overflow-y:auto;flex:1;}
  .modal-section{display:none;}
  .modal-section.active{display:block;}

  .avatar-preview-row{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px;}
  .avatar-preview{
    width:88px;height:88px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.6rem;font-weight:700;color:#0a0c11;
    border:2px solid var(--border-strong);
    overflow:hidden;background-size:cover;background-position:center;
  }
  .avatar-actions{display:flex;gap:8px;}

  .wallpaper-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .wallpaper-swatch{aspect-ratio:1.4;border-radius:var(--r-sm);border:2px solid var(--border);cursor:pointer;position:relative;background-color:var(--inset);overflow:hidden;}
  .wallpaper-swatch.selected{border-color:var(--accent-solid);}
  .wallpaper-swatch .swatch-label{position:absolute;left:6px;bottom:5px;font-size:0.65rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);}
  .wallpaper-swatch.none-swatch{display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:0.7rem;font-weight:700;}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);}
  .settings-row-label{font-size:0.85rem;font-weight:600;}
  .settings-row-sub{font-size:0.74rem;color:var(--text-3);margin-top:2px;}
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch-track{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;cursor:pointer;transition:background .15s ease;}
  .switch-track::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s ease;}
  .switch input:checked + .switch-track{background:var(--accent-solid);}
  .switch input:checked + .switch-track::before{transform:translateX(16px);}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    #sidebar{
      position:fixed;top:0;bottom:0;left:0;
      z-index:40;
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:20px 0 50px -20px rgba(0,0,0,0.6);
    }
    #sidebar.open{transform:translateX(0);}
    #menu-btn{display:inline-flex;}
    .stream-tile{width:190px;height:126px;}
    #composer{gap:4px;padding:12px;}
  }
  @media (max-width:520px){
    .msg-group{max-width:88%;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:0.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="aurora-ribbon"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="auroraGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34e0a1"/>
      <stop offset="1" stop-color="#7c6fee"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">

  <!-- ================= USERNAME SCREEN ================= -->
  <div id="screen-username" class="screen">
    <div class="auth-card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 17c2-3 4-4 6-4s4 3 6 3 3-2 6-2" stroke="url(#auroraGrad)" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 12c2-4 4-5.5 6-5.5s4 4 6 4 3-2.5 6-2.5" stroke="url(#auroraGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>
      <h1>Join Aurora</h1>
      <p>Pick a display name. Once it's yours, no one else can use it while you're online.</p>

      <div class="field-wrap">
        <input type="text" id="username-input" class="field" placeholder="yourname" maxlength="20" autocomplete="off">
        <div class="field-status" id="field-status"></div>
      </div>
      <div class="hint muted" id="username-hint">3–20 characters: letters, numbers, underscore.</div>

      <button id="join-btn" class="btn btn-primary" style="width:100%;" disabled>
        <span id="join-btn-label">Enter chat</span>
      </button>
    </div>
  </div>

  <!-- ================= CHAT SCREEN ================= -->
  <div id="screen-chat" class="screen" style="display:none;">
    <div id="drawer-overlay"></div>

    <aside id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 17c2-3 4-4 6-4s4 3 6 3 3-2 6-2" stroke="url(#auroraGrad)" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3 12c2-4 4-5.5 6-5.5s4 4 6 4 3-2.5 6-2.5" stroke="url(#auroraGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
          </svg>
        </div>
        <span class="wordmark">Aurora</span>
      </div>

      <div class="sidebar-scroll">
        <div class="sidebar-section" id="online-section">
          <div class="sidebar-heading"><span class="online-dot-sm"></span>Online<span class="count-badge" id="online-count-badge">1</span></div>
          <div id="online-list" class="user-list"></div>
        </div>
        <div class="sidebar-section" id="live-section" style="display:none;">
          <div class="sidebar-heading"><span class="live-dot-sm"></span>Live now</div>
          <div id="live-list" class="user-list"></div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="self-pill">
          <div class="mini-avatar" id="self-avatar"></div>
          <span id="self-name"></span>
          <span class="tag" id="self-admin-tag" style="display:none;">ADMIN</span>
        </div>
        <button id="leave-btn" class="icon-btn" type="button" title="Leave chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 16l4-4-4-4M20 12H9"/>
          </svg>
        </button>
      </div>
    </aside>

    <main id="main-panel">
      <header class="chat-header">
        <button id="menu-btn" class="icon-btn" type="button" title="Menu">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="header-title">
          <h1>Aurora</h1>
          <p id="header-subtitle">1 online</p>
        </div>
        <div class="header-actions">
          <button id="call-toggle-btn" class="icon-btn" type="button" title="Start a call">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
          </button>
          <button id="share-toggle-btn" class="icon-btn" type="button" title="Share your screen">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="13" rx="2"/>
              <path d="M8 21h8M12 17v4"/>
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn" type="button" title="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="var(--panel-bg)"/>
              <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="var(--panel-bg)"/>
              <line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2" fill="var(--panel-bg)"/>
            </svg>
          </button>
          <button id="clear-all-btn" class="icon-btn danger" type="button" title="Delete all messages" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
            </svg>
          </button>
        </div>
      </header>

      <div id="stream-strip"></div>

      <div id="chat-box-wrapper">
        <div id="wallpaper-layer"></div>
        <div id="chat-box"></div>
      </div>

      <div id="typing-row"></div>

      <form id="chat-form">
        <div id="composer">
          <input type="file" id="file-input" hidden>
          <button id="attach-btn" class="icon-btn" type="button" title="Send a file" aria-label="Send a file">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.44 11.05 12.25 20.24a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <button id="emoji-btn" class="icon-btn" type="button" title="Emoji" aria-label="Emoji">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>
            </svg>
          </button>
          <button id="mic-btn" class="icon-btn" type="button" title="Record a voice message" aria-label="Record a voice message">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="3" width="6" height="11" rx="3"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
            </svg>
          </button>
          <div id="recording-ui">
            <span class="rec-dot"></span>
            <span id="rec-timer">0:00</span>
            <span class="rec-hint">Recording…</span>
            <div class="rec-actions">
              <button type="button" id="rec-cancel" class="icon-btn danger" title="Discard">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
                </svg>
              </button>
              <button type="button" id="rec-send" class="btn btn-primary btn-round" title="Send voice message">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 6 9 17l-5-5"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="input-wrap">
            <div id="emoji-autocomplete" class="emoji-autocomplete"></div>
            <textarea id="message-input" class="field" placeholder="Message..." rows="1"></textarea>
          </div>
          <button id="send-btn" class="btn btn-primary btn-round" type="submit" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>

</div>

<div id="toast-stack"></div>

<!-- ================= SETTINGS MODAL ================= -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Settings</h2>
      <button id="modal-close-btn" class="icon-btn" type="button" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-tabs">
      <button type="button" class="modal-tab active" data-tab="profile">Profile</button>
      <button type="button" class="modal-tab" data-tab="wallpaper">Wallpaper</button>
    </div>
    <div class="modal-body">
      <div class="modal-section active" data-section="profile">
        <div class="avatar-preview-row">
          <div class="avatar-preview" id="avatar-preview"></div>
          <div class="avatar-actions">

  function blobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  function compressImage(file, maxDim, quality, forceJpeg){
    if (!forceJpeg && file.type === 'image/gif') return blobToDataURL(file);
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        let width = img.naturalWidth, height = img.naturalHeight;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(objectUrl);
        let mime = 'image/jpeg';
        if (!forceJpeg && file.type === 'image/png' && file.size < 800 * 1024) mime = 'image/png';
        try {
          resolve(canvas.toDataURL(mime, mime === 'image/jpeg' ? quality : undefined));
        } catch (err) { reject(err); }
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Could not load image')); };
      img.src = objectUrl;
    });
  }

  function applyAutocomplete(index){

    if (!match || !autocompleteRange) return;
    const val = messageInput.value;
    const before = val.slice(0, autocompleteRange.start);
    const after = val.slice(autocompleteRange.end);
    const insertText = match.char + ' ';
    messageInput.value = before + insertText + after;
    const newPos = before.length + insertText.length;
    messageInput.setSelectionRange(newPos, newPos);

  function handleEmojiTyping(){
    const val = messageInput.value;
    const cursor = messageInput.selectionStart;
    const uptoCursor = val.slice(0, cursor);

    const completed = uptoCursor.match(/(^|\s):([a-z0-9_+\-]{1,20}):$/i);
    if (completed) {
      const code = completed[2].toLowerCase();
      if (EMOJI_MAP[code]) {
        const fullMatchStr = completed[0];
        const startIdx = cursor - fullMatchStr.length + completed[1].length;
        const before = val.slice(0, startIdx);
        const after = val.slice(cursor);
        const insertText = EMOJI_MAP[code] + ' ';
        messageInput.value = before + insertText + after;
        const newPos = before.length + insertText.length;
        messageInput.setSelectionRange(newPos, newPos);
        hideEmojiAutocomplete();
        autoGrow();
        sendBtn.disabled = messageInput.value.trim() === '';
        return;
      }
    }

    const partialMatch = uptoCursor.match(/(?:^|\s):([a-z0-9_+\-]{1,20})$/i);
    if (partialMatch) {
      const partial = partialMatch[1].toLowerCase();
      const startIdx = cursor - partial.length - 1;
      const results = ALL_EMOJIS.filter(e => e.code.startsWith(partial)).slice(0, 6);
      if (results.length) {
        autocompleteMatches = results;
        autocompleteIndex = 0;
        autocompleteRange = { start: startIdx, end: cursor };
        renderEmojiAutocomplete();
        return;
      }
    }
    hideEmojiAutocomplete();
  }

  async function handleFileSelected(file){
    if (file.size > MAX_FILE_BYTES) { toast('Files must be under 5MB.', 'error'); return; }

    if (file.type.startsWith('image/')) {
      try {
        const dataUrl = await compressImage(file, 1600, 0.82, false);
        await db.ref('messages').push({
          type: 'image', username: currentUsername, isAdmin: isAdminUser, timestamp: Date.now(),
          imageData: dataUrl, fileName: file.name, fileSize: file.size
        });
      } catch (err) { toast('Could not send that image.', 'error'); }
      return;
    }

    try {
      const dataUrl = await blobToDataURL(file);
      await db.ref('messages').push({
        type: 'file', username: currentUsername, isAdmin: isAdminUser, timestamp: Date.now(),
        fileData: dataUrl, fileName: file.name, fileType: file.type || 'application/octet-stream', fileSize: file.size
      });
