<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <div id="username-screen">
      <h1>Welcome to Live Chat</h1>
      <p>Enter a display name to start chatting</p>
      <input type="text" id="username-input" placeholder="e.g. Gamer123" maxlength="20">
      <button id="join-btn">Join Chat</button>
    </div>

    <div id="chat-screen" style="display: none;">
      <div class="chat-header">
        <h2>Global Chat</h2>
        <span id="user-badge"></span>
      </div>
      <div id="chat-box"></div>
      <form id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
