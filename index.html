<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aurora — Live Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c11;
    --sidebar-bg:#0d1016;
    --panel-bg:#0f1218;
    --surface:#161a22;
    --surface-hover:#1c212b;
    --inset:#0b0d13;
    --border:#20252f;
    --border-strong:#2b3140;
    --text-1:#edeff3;
    --text-2:#8d93a3;
    --text-3:#565c6d;
    --accent-1:#34e0a1;
    --accent-2:#7c6fee;
    --accent-solid:#5b6ee8;
    --accent-solid-hover:#6c7ded;
    --red:#ff5c72;
    --red-bg:rgba(255,92,114,0.12);
    --amber:#f2b705;
    --amber-bg:rgba(242,183,5,0.12);
    --r-xs:6px;
    --r-sm:10px;
    --r-md:14px;
    --r-lg:18px;
    --shell-max:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--text-1);
    overflow:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 900px 500px at 50% -8%, rgba(124,111,238,0.12), transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .aurora-ribbon{
    position:fixed;
    top:0;left:0;right:0;
    height:3px;
    background:linear-gradient(90deg,var(--accent-1),var(--accent-2),var(--accent-1));
    background-size:200% 100%;
    animation:shimmer 9s linear infinite;
    z-index:100;
  }
  @keyframes shimmer{
    0%{background-position:0% 0;}
    100%{background-position:200% 0;}
  }
  ::selection{background:rgba(91,110,232,0.35);}
  svg{display:block;}
  button{font-family:inherit;}
  textarea, input{font-family:inherit;}

  /* ---------- shared controls ---------- */
  .field{
    width:100%;
    background:var(--inset);
    border:1.5px solid var(--border);
    border-radius:var(--r-sm);
    color:var(--text-1);
    font-family:inherit;
    font-size:0.95rem;
    font-weight:500;
    padding:12px 14px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field::placeholder{color:var(--text-3);}
  .field:focus{
    border-color:var(--accent-solid);
    box-shadow:0 0 0 3px rgba(91,110,232,0.18);
  }
  .btn{
    appearance:none;-webkit-appearance:none;
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:600;
    color:#fff;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:transform .12s ease, opacity .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(0.95);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{
    background:var(--accent-solid);
    border-radius:var(--r-sm);
    padding:12px 18px;
    font-size:0.94rem;
  }
  .btn-primary:not(:disabled):hover{background:var(--accent-solid-hover);}
  .btn-round{
    width:40px;height:40px;
    border-radius:50%;
    flex-shrink:0;
    padding:0;
  }
  .icon-btn{
    background:transparent;
    border:1px solid transparent;
    border-radius:var(--r-xs);
    width:36px;height:36px;
    color:var(--text-2);
    cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--surface-hover);color:var(--text-1);}
  .icon-btn.danger:hover{color:var(--red);background:var(--red-bg);}
  .icon-btn.is-live{color:var(--red);background:var(--red-bg);border-color:rgba(255,92,114,0.35);}
  .icon-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .icon-btn:disabled:hover{background:transparent;color:var(--text-2);}
  :focus-visible{outline:2px solid var(--accent-solid);outline-offset:2px;}

  /* ---------- app shell ---------- */
  #app{position:relative;z-index:1;height:100dvh;width:100%;}
  .screen{height:100%;width:100%;}

  /* ---------- username screen ---------- */
  #screen-username{
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .auth-card{
    width:100%;
    max-width:400px;
    background:var(--panel-bg);
    border:1px solid var(--border);
    border-radius:var(--r-lg);
    padding:36px 32px;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7);
  }
  .brand-mark{
    width:46px;height:46px;
    border-radius:var(--r-sm);
    background:var(--surface);
    border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .brand-mark svg{width:24px;height:24px;}
  .auth-card h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  .auth-card p{
    font-size:0.92rem;
    color:var(--text-2);
    margin-bottom:26px;
    line-height:1.55;
  }
  .field-wrap{position:relative;margin-bottom:6px;}
  .field-wrap .field{padding-right:42px;}
  .field-status{
    position:absolute;
    right:12px;top:50%;
    transform:translateY(-50%);
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .field-status .spinner{
    width:15px;height:15px;
    border:2px solid rgba(255,255,255,0.12);
    border-top-color:var(--text-2);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .hint{
    min-height:18px;
    font-size:0.78rem;
    font-weight:500;
    margin:8px 2px 20px;
    display:flex;align-items:center;gap:6px;
  }
  .hint.ok{color:var(--accent-1);}
  .hint.bad{color:var(--red);}
  .hint.muted{color:var(--text-3);}
  .shake{animation:shake .35s;}
  @keyframes shake{
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }

  /* ---------- chat screen shell ---------- */
  #screen-chat{
    display:flex;
    height:100%;
    max-width:var(--shell-max);
    margin:0 auto;
    border-left:1px solid var(--border);
    border-right:1px solid var(--border);
  }
  #drawer-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    z-index:39;
  }
  #drawer-overlay.open{display:block;}

  /* ---------- sidebar ---------- */
  #sidebar{
    width:264px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-brand{
    display:flex;align-items:center;gap:10px;
    padding:18px 18px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .sidebar-brand .brand-mark{width:32px;height:32px;margin:0;border-radius:9px;}
  .sidebar-brand .brand-mark svg{width:17px;height:17px;}
  .sidebar-brand .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:-0.01em;
  }
  .sidebar-scroll{
    flex:1;
    overflow-y:auto;
    padding:14px 10px;
  }
  .sidebar-scroll::-webkit-scrollbar{width:5px;}
  .sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  .sidebar-section{margin-bottom:18px;}
  .sidebar-heading{
    display:flex;align-items:center;gap:6px;
    font-size:0.7rem;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-3);
    padding:0 8px 8px;
  }
  .sidebar-heading .count-badge{
    background:var(--surface);
    color:var(--text-2);
    border-radius:999px;
    font-size:0.65rem;
    padding:1px 6px;
    font-weight:700;
  }
  .live-dot-sm{
    width:6px;height:6px;border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    box-shadow:0 0 0 3px var(--red-bg);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  .online-dot-sm{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent-1);
    flex-shrink:0;
    box-shadow:0 0 0 3px rgba(52,224,161,0.15);
  }
  @keyframes pulseDot{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .user-list{display:flex;flex-direction:column;gap:1px;}
  .user-row{
    display:flex;align-items:center;gap:9px;
    padding:7px 8px;
    border-radius:var(--r-xs);
    font-size:0.85rem;
    font-weight:500;
    color:var(--text-1);
  }
  .user-row.is-self{background:var(--surface);}
  .mini-avatar{
    width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.6rem;font-weight:700;color:#0a0c11;
    flex-shrink:0;
  }
  .user-row-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .you-tag{font-size:0.68rem;font-weight:600;color:var(--text-3);}
  .tag{
    font-size:0.6rem;font-weight:700;letter-spacing:0.03em;
    color:var(--amber);
    background:var(--amber-bg);
    border:1px solid rgba(242,183,5,0.35);
    padding:2px 6px;border-radius:5px;
    flex-shrink:0;
  }
  .live-row{padding:7px 8px;}
  .watch-btn{
    appearance:none;border:1px solid var(--border-strong);
    background:transparent;color:var(--text-2);
    font-family:inherit;font-size:0.72rem;font-weight:700;
    padding:4px 10px;border-radius:999px;cursor:pointer;
    flex-shrink:0;
    transition:all .15s ease;
  }
  .watch-btn:hover{border-color:var(--accent-solid);color:var(--text-1);}
  .watch-btn.watching{background:var(--red-bg);border-color:rgba(255,92,114,0.4);color:var(--red);}
  .list-empty{padding:6px 8px;font-size:0.8rem;color:var(--text-3);}

  .sidebar-footer{
    padding:12px;
    border-top:1px solid var(--border);
    display:flex;align-items:center;gap:8px;
    flex-shrink:0;
  }
  .self-pill{
    flex:1;min-width:0;
    display:flex;align-items:center;gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px 5px 5px;
    font-size:0.82rem;font-weight:600;
  }
  .self-pill .mini-avatar{width:26px;height:26px;font-size:0.64rem;}
  #self-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- main panel ---------- */
  #main-panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:var(--panel-bg);
  }
  .chat-header{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  #menu-btn{display:none;}
  .header-title{flex:1;min-width:0;}
  .header-title h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.02rem;font-weight:700;letter-spacing:-0.01em;
  }
  .header-title p{
    font-size:0.76rem;color:var(--text-2);font-weight:500;
    font-variant-numeric:tabular-nums;
  }
  .header-actions{display:flex;align-items:center;gap:4px;}

  /* ---------- stream strip ---------- */
  #stream-strip{
    display:none;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    overflow-x:auto;
    flex-shrink:0;
    background:var(--inset);
  }
  #stream-strip::-webkit-scrollbar{height:5px;}
  #stream-strip::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  .stream-tile{
    position:relative;
    flex-shrink:0;
    width:230px;height:150px;
    background:#000;
    border-radius:var(--r-sm);
    overflow:hidden;
    border:1px solid var(--border-strong);
  }
  .stream-tile video{
    width:100%;height:100%;
    object-fit:contain;
    background:#000;
  }
  .stream-tile.is-self{border-color:rgba(91,110,232,0.5);}
  .tile-label{
    position:absolute;left:8px;bottom:8px;
    display:flex;align-items:center;gap:6px;
    background:rgba(10,12,17,0.72);
    backdrop-filter:blur(6px);
    padding:4px 9px;
    border-radius:999px;
    font-size:0.72rem;font-weight:600;
    max-width:calc(100% - 50px);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tile-close{
    position:absolute;top:6px;right:6px;
    width:24px;height:24px;
    border-radius:50%;
    background:rgba(10,12,17,0.72);
    backdrop-filter:blur(6px);
    border:none;
    color:var(--text-2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .tile-close:hover{color:var(--red);}

  /* ---------- messages ---------- */
  #chat-box{
    flex:1;
    overflow-y:auto;
    padding:18px 18px 4px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  #chat-box::-webkit-scrollbar{width:6px;}
  #chat-box::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;}
  #chat-box::-webkit-scrollbar-track{background:transparent;}

  .empty-state{
    margin:auto;
    text-align:center;
    color:var(--text-3);
    font-size:0.86rem;
    font-weight:500;
    padding:40px 20px;
  }

  .msg-group{
    display:flex;
    gap:10px;
    max-width:78%;
    animation:riseIn .22s ease both;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  .msg-group.own{align-self:flex-end;flex-direction:row-reverse;}
  .msg-group .avatar{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:0.64rem;font-weight:700;color:#0a0c11;
    flex-shrink:0;
    margin-top:2px;
  }
  .group-body{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .msg-group.own .group-body{align-items:flex-end;}
  .group-meta{
    display:flex;align-items:center;gap:6px;
    font-size:0.75rem;font-weight:600;color:var(--text-2);
    padding:0 2px;
  }
  .group-time{font-weight:500;color:var(--text-3);}
  .bubble-stack{display:flex;flex-direction:column;gap:3px;}
  .msg-group.own .bubble-stack{align-items:flex-end;}

  .bubble{
    position:relative;
    padding:9px 13px;
    font-size:0.9rem;
    font-weight:400;
    line-height:1.45;
    word-wrap:break-word;
    max-width:100%;
    border-radius:var(--r-sm);
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-1);
  }
  .msg-group.own .bubble{
    background:var(--accent-solid);
    border:none;
    color:#fff;
  }
  .msg-group.admin-sender .bubble{border-left:2.5px solid var(--amber);}
  .msg-group.own.admin-sender .bubble{border-left:2.5px solid rgba(255,255,255,0.5);}
  .bubble-delete{
    position:absolute;
    top:-8px;
    background:var(--panel-bg);
    border:1px solid var(--border-strong);
    border-radius:50%;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-2);
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease,color .15s ease;
  }
  .msg-group.own .bubble-delete{left:-8px;}
  .msg-group:not(.own) .bubble-delete{right:-8px;}
  .bubble:hover .bubble-delete{opacity:1;}
  .bubble-delete:hover{color:var(--red);}

  /* voice message bubble */
  .bubble-voice{padding:8px 12px;min-width:200px;}
  .voice-msg{display:flex;align-items:center;gap:9px;}
  .voice-play-btn{
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:none;color:inherit;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
    transition:background .15s ease;
  }
  .msg-group:not(.own) .voice-play-btn{background:rgba(255,255,255,0.08);}
  .voice-play-btn:hover{background:rgba(255,255,255,0.22);}
  .voice-track{
    flex:1;height:5px;border-radius:99px;
    background:rgba(255,255,255,0.18);
    cursor:pointer;position:relative;
    min-width:70px;
  }
  .msg-group:not(.own) .voice-track{background:rgba(255,255,255,0.1);}
  .voice-progress{
    position:absolute;left:0;top:0;bottom:0;
    width:0%;border-radius:99px;
    background:#fff;
  }
  .msg-group:not(.own) .voice-progress{background:var(--accent-solid);}
  .voice-time{
    font-size:0.72rem;font-weight:600;
    font-variant-numeric:tabular-nums;
    color:inherit;opacity:0.85;
    flex-shrink:0;
  }

  #typing-row{
    height:20px;
    padding:0 20px 4px;
    display:flex;align-items:center;gap:8px;
    font-size:0.76rem;font-weight:500;color:var(--text-3);
    flex-shrink:0;
  }
  .typing-dots{display:flex;gap:3px;}
  .typing-dots span{
    width:4px;height:4px;border-radius:50%;
    background:var(--text-3);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-3px);opacity:1;}
  }

  /* ---------- composer ---------- */
  #composer{
    display:flex;
    align-items:flex-end;
    gap:8px;
    padding:14px 16px;
    border-top:1px solid var(--border);
    flex-shrink:0;
  }
  #message-input{
    flex:1;
    resize:none;
    max-height:110px;
    min-height:40px;
    line-height:1.4;
    font-size:0.92rem;
    padding:10px 14px;
    border-radius:20px;
  }
  #composer.is-recording .field,
  #composer.is-recording #mic-btn,
  #composer.is-recording #send-btn{display:none;}
  #recording-ui{
    display:none;
    flex:1;
    align-items:center;gap:10px;
    background:var(--inset);
    border:1.5px solid rgba(255,92,114,0.35);
    border-radius:20px;
    padding:6px 8px 6px 16px;
    min-height:40px;
  }
  #composer.is-recording #recording-ui{display:flex;}
  .rec-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--red);
    flex-shrink:0;
    animation:pulseDot 1.1s ease-in-out infinite;
  }
  #rec-timer{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:0.88rem;
    font-variant-numeric:tabular-nums;
    color:var(--text-1);
  }
  .rec-hint{font-size:0.8rem;color:var(--text-2);flex:1;}
  .rec-actions{display:flex;align-items:center;gap:6px;}
  .rec-actions .btn-round{width:32px;height:32px;}
  .rec-actions .icon-btn{width:32px;height:32px;}

  /* ---------- toasts ---------- */
  #toast-stack{
    position:fixed;
    bottom:20px;right:20px;
    display:flex;flex-direction:column;gap:8px;
    z-index:110;
    max-width:320px;
  }
  .toast{
    background:var(--surface);
    border:1px solid var(--border-strong);
    border-left:3px solid var(--accent-solid);
    border-radius:var(--r-xs);
    padding:11px 14px;
    font-size:0.83rem;font-weight:500;
    color:var(--text-1);
    box-shadow:0 12px 30px -10px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateY(0);}
  .toast-error{border-left-color:var(--red);}

  /* ---------- responsive ---------- */
  @media (max-width:860px){
    #screen-chat{max-width:none;border-left:none;border-right:none;}
    #sidebar{
      position:fixed;top:0;bottom:0;left:0;
      z-index:40;
      transform:translateX(-100%);
      transition:transform .22s ease;
      box-shadow:20px 0 50px -20px rgba(0,0,0,0.6);
    }
    #sidebar.open{transform:translateX(0);}

  @media (prefers-reduced-motion: reduce){

<div id="app">

            <path d="M4 7h16M4 12h16M4 17h16"/>

            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

              <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
            </svg>

                  <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
                </svg>

                  <path d="M20 6 9 17l-5-5"/>

              <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/>

    </main>
  </div>

</div>

<div id="toast-stack"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyANBev0K1e06T5aHBC5EKXaswbMwELSkkQ",
    authDomain: "test-912a8.firebaseapp.com",
    databaseURL: "https://test-912a8-default-rtdb.firebaseio.com",
    projectId: "test-912a8",
    storageBucket: "test-912a8.firebasestorage.app",
    messagingSenderId: "990322948527",
    appId: "1:990322948527:web:025a19c36a1e8ce7cad75a",
    measurementId: "G-70LTDPV6HZ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_USERNAME = "brodanistheman";
  const NAME_PATTERN = /^[A-Za-z0-9_]{3,20}$/;
  const MAX_RECORDING_MS = 120000; // 2 minute cap on voice messages
  const ICE_SERVERS = [{ urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302"] }];

  let currentUsername = "";
  let currentKey = "";
  let isAdminUser = false;
  let typingTimeout = null;
  let isTyping = false;
  let lastOnlineCount = 1;

  // voice recording state
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordingStream = null;
  let recordingMime = "";
  let isRecording = false;
  let pendingSend = false;
  let recordingStartTime = 0;
  let recordingTimerInterval = null;

  // screen sharing state
  let isSharingScreen = false;
  let localScreenStream = null;
  let broadcastPeers = {};        // viewerKey -> RTCPeerConnection
  let broadcastListenerRefs = {}; // viewerKey -> {answerRef, answerHandler, candRef, candHandler}
  let watchingPeers = {};         // broadcasterKey -> RTCPeerConnection
  let watchListenerRefs = {};     // broadcasterKey -> {offerRef, offerHandler, candRef, candHandler}
  let liveShares = {};            // broadcasterKey -> {display, startedAt}

  // ---------- DOM refs ----------
  const screenUsername = document.getElementById('screen-username');
  const screenChat = document.getElementById('screen-chat');
  const usernameInput = document.getElementById('username-input');
  const fieldStatus = document.getElementById('field-status');
  const usernameHint = document.getElementById('username-hint');
  const joinBtn = document.getElementById('join-btn');
  const joinBtnLabel = document.getElementById('join-btn-label');

  const sidebar = document.getElementById('sidebar');
  const drawerOverlay = document.getElementById('drawer-overlay');
  const menuBtn = document.getElementById('menu-btn');
  const onlineList = document.getElementById('online-list');
  const onlineCountBadge = document.getElementById('online-count-badge');
  const liveSection = document.getElementById('live-section');
  const liveList = document.getElementById('live-list');

  const selfAvatar = document.getElementById('self-avatar');
  const selfName = document.getElementById('self-name');
  const selfAdminTag = document.getElementById('self-admin-tag');
  const headerSubtitle = document.getElementById('header-subtitle');
  const clearAllBtn = document.getElementById('clear-all-btn');
  const leaveBtn = document.getElementById('leave-btn');
  const shareToggleBtn = document.getElementById('share-toggle-btn');
  const streamStrip = document.getElementById('stream-strip');

  const chatBox = document.getElementById('chat-box');
  const typingRow = document.getElementById('typing-row');
  const chatForm = document.getElementById('chat-form');
  const messageInput = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  const micBtn = document.getElementById('mic-btn');
  const composerEl = document.getElementById('composer');
  const recordingUi = document.getElementById('recording-ui');
  const recTimerEl = document.getElementById('rec-timer');
  const recCancelBtn = document.getElementById('rec-cancel');
  const recSendBtn = document.getElementById('rec-send');

  const toastStack = document.getElementById('toast-stack');

  // ---------- helpers ----------
  function escapeHTML(str){
    return String(str).replace(/[&<>'"]/g,
      t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
  }
  function hueFromString(str){
    let h = 0;
    for (let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) % 360;
    return h;
  }
  function avatarStyle(name){
    const h = hueFromString(name.toLowerCase());
    return `background:linear-gradient(135deg,hsl(${h},75%,62%),hsl(${(h+45)%360},75%,62%));`;
  }
  function initials(name){
    return name.slice(0,2).toUpperCase();
  }
  function formatTime(ts){
    return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  function formatDuration(totalSeconds){
    const s = Math.max(0, Math.floor(totalSeconds || 0));
    const m = Math.floor(s/60);
    const sec = s % 60;
    return m + ':' + String(sec).padStart(2,'0');
  }
  function setHint(text, cls){
    usernameHint.textContent = text;
    usernameHint.className = 'hint ' + cls;
  }
  function toast(message, kind){
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'error' ? ' toast-error' : '');
    el.textContent = message;
    toastStack.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 250);
    }, 4200);
  }
  function playIconSVG(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
  function pauseIconSVG(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  }
  function closeIconSVG(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  }

  // ---------- username availability (debounced live check) ----------
  let checkTimer = null;
  usernameInput.addEventListener('input', () => {
    const val = usernameInput.value.trim();
    joinBtn.disabled = true;
    fieldStatus.innerHTML = '';
    clearTimeout(checkTimer);

    if (val === '') { setHint('3–20 characters: letters, numbers, underscore.', 'muted'); return; }
    if (!NAME_PATTERN.test(val)) { setHint('Only letters, numbers, underscore — 3 to 20 characters.', 'bad'); return; }

    fieldStatus.innerHTML = '<div class="spinner"></div>';
    setHint('Checking availability…', 'muted');

    checkTimer = setTimeout(() => {
      db.ref('activeUsers/' + val.toLowerCase()).once('value').then(snap => {
        if (usernameInput.value.trim() !== val) return; // stale
        if (snap.exists()) {
          fieldStatus.innerHTML = xIcon();
          setHint('That name is already taken.', 'bad');
          joinBtn.disabled = true;
        } else {
          fieldStatus.innerHTML = checkIcon();
          setHint('Available.', 'ok');
          joinBtn.disabled = false;
        }
      });
    }, 350);
  });

  function checkIcon(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34e0a1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  }
  function xIcon(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff5c72" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  }

  usernameInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !joinBtn.disabled) joinBtn.click();
  });

  // ---------- claim username & join ----------
  joinBtn.addEventListener('click', async () => {
    const val = usernameInput.value.trim();
    if (!NAME_PATTERN.test(val)) return;

    joinBtn.disabled = true;
    joinBtnLabel.textContent = 'Joining…';

    const key = val.toLowerCase();
    const ref = db.ref('activeUsers/' + key);

    try {
      const result = await ref.transaction(current => {
        if (current === null) {
          return { display: val, joinedAt: Date.now() };
        }
        return; // abort — already taken
      });

      if (!result.committed) {
        joinBtnLabel.textContent = 'Enter chat';
        fieldStatus.innerHTML = xIcon();
        setHint('Someone just took that name — try another.', 'bad');
        document.querySelector('.auth-card').classList.add('shake');
        setTimeout(() => document.querySelector('.auth-card').classList.remove('shake'), 350);
        return;
      }

      ref.onDisconnect().remove();

      currentUsername = val;
      currentKey = key;
      isAdminUser = key === ADMIN_USERNAME;

      enterChat();
    } catch (err) {
      joinBtnLabel.textContent = 'Enter chat';
      setHint('Connection error — please try again.', 'bad');
      joinBtn.disabled = false;
    }
  });

  function enterChat(){
    selfName.textContent = '@' + currentUsername;
    selfAvatar.textContent = initials(currentUsername);
    selfAvatar.setAttribute('style', avatarStyle(currentUsername));
    selfAdminTag.style.display = isAdminUser ? 'inline-block' : 'none';
    clearAllBtn.style.display = isAdminUser ? 'flex' : 'none';

    screenUsername.style.display = 'none';
    screenChat.style.display = 'flex';

    listenForMessages();
    listenForPresence();
    listenForTyping();
    listenForScreenShares();
    messageInput.focus();
  }

  // ---------- leave / cleanup ----------
  function cleanupAndLeave(){
    if (isRecording) stopRecording(false);
    if (isSharingScreen) stopScreenShare();
    Object.keys(watchingPeers).forEach(key => stopWatching(key));
    if (currentKey) {
      db.ref('activeUsers/' + currentKey).remove();
      db.ref('typing/' + currentKey).remove();
    }
    location.reload();
  }
  leaveBtn.addEventListener('click', cleanupAndLeave);

  // ---------- mobile drawer ----------
  menuBtn.addEventListener('click', () => {
    sidebar.classList.add('open');
    drawerOverlay.classList.add('open');
  });
  drawerOverlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    drawerOverlay.classList.remove('open');
  });

  // ---------- presence / online list ----------
  function listenForPresence(){
    db.ref('activeUsers').on('value', snap => {
      const n = snap.numChildren();
      lastOnlineCount = n;
      onlineCountBadge.textContent = n;
      updateHeaderSubtitle();

      const rows = [];
      snap.forEach(child => {
        const v = child.val();
        const key = child.key;
        const isSelf = key === currentKey;
        const isAdminRow = key === ADMIN_USERNAME;
        rows.push(
          '<div class="user-row' + (isSelf ? ' is-self' : '') + '">' +
            '<div class="mini-avatar" style="' + avatarStyle(v.display) + '">' + initials(v.display) + '</div>' +
            '<span class="user-row-name">' + escapeHTML(v.display) + '</span>' +
            (isAdminRow ? '<span class="tag">ADMIN</span>' : '') +
            (isSelf ? '<span class="you-tag">you</span>' : '') +
          '</div>'
        );
      });
      onlineList.innerHTML = rows.join('') || '<div class="list-empty">Nobody else is here yet.</div>';
    });
  }

  function updateHeaderSubtitle(){
    const liveN = Object.keys(liveShares).length;
    let text = lastOnlineCount === 1 ? '1 online' : lastOnlineCount + ' online';
    if (liveN > 0) text += ' · ' + liveN + (liveN === 1 ? ' live' : ' live');
    headerSubtitle.textContent = text;
  }

  // ---------- typing indicator ----------
  messageInput.addEventListener('input', () => {
    autoGrow();
    sendBtn.disabled = messageInput.value.trim() === '';

    if (!isTyping) {
      isTyping = true;
      db.ref('typing/' + currentKey).set({ display: currentUsername, ts: Date.now() });
      db.ref('typing/' + currentKey).onDisconnect().remove();
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(stopTyping, 1800);
  });
  function stopTyping(){
    isTyping = false;
    db.ref('typing/' + currentKey).remove();
  }
  function autoGrow(){
    messageInput.style.height = 'auto';
    messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + 'px';
  }
  messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      chatForm.requestSubmit();
    }
  });

  function listenForTyping(){
    db.ref('typing').on('value', snap => {
      const now = Date.now();
      const others = [];
      snap.forEach(child => {
        const v = child.val();
        if (child.key !== currentKey && v && (now - v.ts) < 5000) others.push(v.display);
      });
      if (others.length === 0) {
        typingRow.innerHTML = '';
      } else {
        const label = others.length === 1
          ? `${escapeHTML(others[0])} is typing`
          : `${others.length} people are typing`;
        typingRow.innerHTML = `<span>${label}</span><span class="typing-dots"><span></span><span></span><span></span></span>`;
      }
    });
  }

  // ---------- sending text messages ----------
  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (text === '') return;

    db.ref('messages').push({
      type: 'text',
      username: currentUsername,
      text: text,
      isAdmin: isAdminUser,
      timestamp: Date.now()
    });

    messageInput.value = '';
    messageInput.style.height = 'auto';
    sendBtn.disabled = true;
    clearTimeout(typingTimeout);
    stopTyping();
  });

  // ---------- admin: clear all ----------
  clearAllBtn.addEventListener('click', () => {
    if (!isAdminUser) return;
    if (confirm('Delete every message in this chat for everyone?')) {
      db.ref('messages').remove();
    }
  });

  // ---------- messages ----------
  function listenForMessages(){
    db.ref('messages').on('child_added', snap => appendMessage(snap.key, snap.val()));
    db.ref('messages').on('child_removed', snap => removeMessage(snap.key));
  }

  function appendMessage(key, msg){
    const emptyState = chatBox.querySelector('.empty-state');
    if (emptyState) emptyState.remove();

    const isOwn = msg.username.toLowerCase() === currentUsername.toLowerCase();
    const lastGroup = chatBox.lastElementChild;
    const canGroup = lastGroup &&
      lastGroup.dataset.userkey === msg.username.toLowerCase() &&
      lastGroup.dataset.own === String(isOwn) &&
      (msg.timestamp - Number(lastGroup.dataset.lastts)) < 5 * 60 * 1000;

    if (canGroup) {
      lastGroup.dataset.lastts = msg.timestamp;
      lastGroup.querySelector('.bubble-stack').appendChild(createBubble(key, msg));
    } else {
      const group = document.createElement('div');
      group.className = 'msg-group ' + (isOwn ? 'own' : 'other') + (msg.isAdmin ? ' admin-sender' : '');
      group.dataset.userkey = msg.username.toLowerCase();
      group.dataset.own = String(isOwn);
      group.dataset.lastts = msg.timestamp;

      let inner = '';
      if (!isOwn) {
        inner += `<div class="avatar" style="${avatarStyle(msg.username)}">${initials(msg.username)}</div>`;
      }
      inner += '<div class="group-body">';
      if (!isOwn) {
        inner += `<div class="group-meta"><span>${escapeHTML(msg.username)}</span>${msg.isAdmin ? '<span class="tag">ADMIN</span>' : ''}<span class="group-time">${formatTime(msg.timestamp)}</span></div>`;
      }
      inner += '<div class="bubble-stack"></div></div>';
      group.innerHTML = inner;

      chatBox.appendChild(group);
      group.querySelector('.bubble-stack').appendChild(createBubble(key, msg));
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function createBubble(key, msg){
    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (msg.type === 'voice' ? ' bubble-voice' : '');
    bubble.dataset.key = key;
    bubble.title = new Date(msg.timestamp).toLocaleString();

    if (msg.type === 'voice') {
      bubble.appendChild(buildVoicePlayer(msg));
    } else {
      const textSpan = document.createElement('span');
      textSpan.className = 'bubble-text';
      textSpan.textContent = msg.text;
      bubble.appendChild(textSpan);
    }

    if (isAdminUser) {
      const del = document.createElement('button');
      del.className = 'bubble-delete';
      del.type = 'button';
      del.title = 'Delete message';
      del.innerHTML = closeIconSVG();
      del.addEventListener('click', () => db.ref('messages/' + key).remove());
      bubble.appendChild(del);
    }
    return bubble;
  }

  function buildVoicePlayer(msg){
    const wrap = document.createElement('div');
    wrap.className = 'voice-msg';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'voice-play-btn';
    btn.innerHTML = playIconSVG();

    const track = document.createElement('div');
    track.className = 'voice-track';
    const progress = document.createElement('div');
    progress.className = 'voice-progress';
    track.appendChild(progress);

    const time = document.createElement('span');
    time.className = 'voice-time';
    time.textContent = formatDuration(msg.duration);

    const audio = document.createElement('audio');
    audio.className = 'voice-audio';
    audio.preload = 'metadata';
    audio.src = msg.audioData;

    wrap.appendChild(btn);
    wrap.appendChild(track);
    wrap.appendChild(time);
    wrap.appendChild(audio);

    btn.addEventListener('click', () => {
      document.querySelectorAll('audio.voice-audio-playing').forEach(a => { if (a !== audio) a.pause(); });
      if (audio.paused) {
        audio.play().catch(() => toast('Could not play this voice message.', 'error'));
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', () => { audio.classList.add('voice-audio-playing'); btn.innerHTML = pauseIconSVG(); });
    audio.addEventListener('pause', () => { audio.classList.remove('voice-audio-playing'); btn.innerHTML = playIconSVG(); });
    audio.addEventListener('ended', () => { progress.style.width = '0%'; time.textContent = formatDuration(msg.duration); });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration && isFinite(audio.duration)) {
        progress.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
        time.textContent = formatDuration(Math.floor(audio.currentTime));
      }
    });
    track.addEventListener('click', (e) => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      const rect = track.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      audio.currentTime = ratio * audio.duration;
    });

    return wrap;
  }

  function removeMessage(key){
    const bubble = chatBox.querySelector(`.bubble[data-key="${key}"]`);
    if (!bubble) return;
    const stack = bubble.parentElement;
    bubble.remove();
    if (stack && stack.children.length === 0) {
      const group = stack.closest('.msg-group');
      if (group) group.remove();
    }
    if (chatBox.children.length === 0) {
      chatBox.innerHTML = '<div class="empty-state">No messages yet — say something.</div>';
    }
  }

  chatBox.innerHTML = '<div class="empty-state">No messages yet — say something.</div>';

  // =================================================================
  // ======================= VOICE MESSAGES =========================
  // =================================================================

  function pickAudioMime(){
    const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    for (const c of candidates) { if (MediaRecorder.isTypeSupported(c)) return c; }
    return '';
  }

  micBtn.addEventListener('click', () => { if (!isRecording) startRecording(); });
  recCancelBtn.addEventListener('click', () => stopRecording(false));
  recSendBtn.addEventListener('click', () => stopRecording(true));

  async function startRecording(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      toast("Voice messages aren't supported in this browser.", 'error');
      return;
    }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      toast('Microphone access was blocked. Check your browser permissions.', 'error');
      return;
    }

    recordingStream = stream;
    recordedChunks = [];
    const mime = pickAudioMime();
    try {
      mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    } catch (err) {
      mediaRecorder = new MediaRecorder(stream);
    }
    recordingMime = mediaRecorder.mimeType || mime || 'audio/webm';

    mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();

    isRecording = true;
    recordingStartTime = Date.now();
    composerEl.classList.add('is-recording');
    recTimerEl.textContent = '0:00';
    recordingTimerInterval = setInterval(updateRecTimer, 250);
  }

  function updateRecTimer(){
    const elapsed = Date.now() - recordingStartTime;
    if (elapsed >= MAX_RECORDING_MS) {
      stopRecording(true);
      return;
    }
    recTimerEl.textContent = formatDuration(elapsed / 1000);
  }

  function stopRecording(shouldSend){
    if (!isRecording) return;
    pendingSend = shouldSend;
    isRecording = false;
    clearInterval(recordingTimerInterval);
    composerEl.classList.remove('is-recording');
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (recordingStream) {
      recordingStream.getTracks().forEach(t => t.stop());
      recordingStream = null;
    }
  }

  async function onRecordingStop(){
    const durationSec = Math.max(1, Math.round((Date.now() - recordingStartTime) / 1000));
    if (!pendingSend || recordedChunks.length === 0) {
      recordedChunks = [];
      return;
    }
    const blob = new Blob(recordedChunks, { type: recordingMime });
    recordedChunks = [];
    try {
      const dataUrl = await blobToDataURL(blob);
      await db.ref('messages').push({
        type: 'voice',
        username: currentUsername,
        isAdmin: isAdminUser,
        timestamp: Date.now(),
        audioData: dataUrl,
        duration: durationSec
      });
    } catch (err) {
      toast('Could not send voice message — try again.', 'error');
    }
  }

  function blobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // =================================================================
  // ====================== SCREEN SHARING ===========================
  // =================================================================

  shareToggleBtn.addEventListener('click', () => {
    if (isSharingScreen) stopScreenShare(); else startScreenShare();
  });

  function updateShareToggleUI(){
    shareToggleBtn.classList.toggle('is-live', isSharingScreen);
    shareToggleBtn.title = isSharingScreen ? 'Stop sharing your screen' : 'Share your screen';
  }

  async function startScreenShare(){
    if (isSharingScreen) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      toast("Your browser doesn't support screen sharing.", 'error');
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    } catch (err) {
      if (!err || err.name !== 'NotAllowedError') {
        toast('Could not start screen sharing.', 'error');
      }
      return;
    }

    localScreenStream = stream;
    isSharingScreen = true;
    updateShareToggleUI();

    const tile = createTile(currentKey, 'You', true);
    tile.querySelector('video').srcObject = stream;

    stream.getVideoTracks()[0].addEventListener('ended', stopScreenShare);

    try {
      await db.ref('screenShares/' + currentKey).set({ display: currentUsername, startedAt: Date.now() });
    } catch (err) {
      toast('Could not announce your stream — try again.', 'error');
      stopScreenShare();
      return;
    }
    db.ref('screenShares/' + currentKey).onDisconnect().remove();
    db.ref('watch/' + currentKey).onDisconnect().remove();
    db.ref('rtc/' + currentKey).onDisconnect().remove();

    db.ref('watch/' + currentKey).on('child_added', snap => createOfferForViewer(snap.key));
    db.ref('watch/' + currentKey).on('child_removed', snap => teardownBroadcastPeer(snap.key));
  }

  async function createOfferForViewer(viewerKey){
    if (broadcastPeers[viewerKey] || !localScreenStream) return;

    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    broadcastPeers[viewerKey] = pc;
    localScreenStream.getTracks().forEach(track => pc.addTrack(track, localScreenStream));

    pc.onicecandidate = (e) => {
      if (e.candidate) db.ref(`rtc/${currentKey}/${viewerKey}/candidates/broadcaster`).push(e.candidate.toJSON());
    };

    const answerRef = db.ref(`rtc/${currentKey}/${viewerKey}/answer`);
    const answerHandler = (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) {
        pc.setRemoteDescription(new RTCSessionDescription(val)).catch(() => {});
      }
    };
    answerRef.on('value', answerHandler);

    const candRef = db.ref(`rtc/${currentKey}/${viewerKey}/candidates/viewer`);
    const candHandler = (snap) => {
      const v = snap.val();
      if (v) pc.addIceCandidate(new RTCIceCandidate(v)).catch(() => {});
    };
    candRef.on('child_added', candHandler);

    broadcastListenerRefs[viewerKey] = { answerRef, answerHandler, candRef, candHandler };

    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await db.ref(`rtc/${currentKey}/${viewerKey}/offer`).set({ sdp: offer.sdp, type: offer.type });
    } catch (err) {
      teardownBroadcastPeer(viewerKey);
    }
  }

  function teardownBroadcastPeer(viewerKey){
    const pc = broadcastPeers[viewerKey];
    if (pc) { pc.close(); delete broadcastPeers[viewerKey]; }
    const refs = broadcastListenerRefs[viewerKey];
    if (refs) {
      refs.answerRef.off('value', refs.answerHandler);
      refs.candRef.off('child_added', refs.candHandler);
      delete broadcastListenerRefs[viewerKey];
    }
    db.ref(`rtc/${currentKey}/${viewerKey}`).remove();
  }

  function stopScreenShare(){
    if (!isSharingScreen) return;
    isSharingScreen = false;
    updateShareToggleUI();

    if (localScreenStream) {
      localScreenStream.getTracks().forEach(t => t.stop());
      localScreenStream = null;
    }
    removeTile(currentKey);

    Object.keys(broadcastPeers).forEach(teardownBroadcastPeer);

    db.ref('watch/' + currentKey).off();
    db.ref('watch/' + currentKey).remove();
    db.ref('screenShares/' + currentKey).remove();
    db.ref('rtc/' + currentKey).remove();
  }

  async function watchStream(broadcasterKey, displayName){
    if (watchingPeers[broadcasterKey]) return;

    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    watchingPeers[broadcasterKey] = pc;
    renderLiveList();

    const tile = createTile(broadcasterKey, displayName, false);

    pc.ontrack = (e) => {
      const video = tile.querySelector('video');
      if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
      video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
    };
    pc.onicecandidate = (e) => {
      if (e.candidate) db.ref(`rtc/${broadcasterKey}/${currentKey}/candidates/viewer`).push(e.candidate.toJSON());
    };

    try {
      await db.ref(`watch/${broadcasterKey}/${currentKey}`).set(true);
    } catch (err) {
      toast('Could not connect to that stream.', 'error');
      stopWatching(broadcasterKey);
      return;
    }
    db.ref(`watch/${broadcasterKey}/${currentKey}`).onDisconnect().remove();

    const offerRef = db.ref(`rtc/${broadcasterKey}/${currentKey}/offer`);
    const offerHandler = async (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) {
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(val));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await db.ref(`rtc/${broadcasterKey}/${currentKey}/answer`).set({ sdp: answer.sdp, type: answer.type });
        } catch (err) { /* ignore transient signaling errors */ }
      }
    };
    offerRef.on('value', offerHandler);

    const candRef = db.ref(`rtc/${broadcasterKey}/${currentKey}/candidates/broadcaster`);
    const candHandler = (snap) => {
      const v = snap.val();
      if (v) pc.addIceCandidate(new RTCIceCandidate(v)).catch(() => {});
    };
    candRef.on('child_added', candHandler);

    watchListenerRefs[broadcasterKey] = { offerRef, offerHandler, candRef, candHandler };
  }

  function stopWatching(broadcasterKey){
    const pc = watchingPeers[broadcasterKey];
    if (pc) { pc.close(); delete watchingPeers[broadcasterKey]; }

    const refs = watchListenerRefs[broadcasterKey];
    if (refs) {
      refs.offerRef.off('value', refs.offerHandler);
      refs.candRef.off('child_added', refs.candHandler);
      delete watchListenerRefs[broadcasterKey];
    }

    db.ref(`watch/${broadcasterKey}/${currentKey}`).off();
    db.ref(`watch/${broadcasterKey}/${currentKey}`).remove();
    db.ref(`rtc/${broadcasterKey}/${currentKey}`).remove();

    removeTile(broadcasterKey);
    renderLiveList();
  }

  function listenForScreenShares(){
    db.ref('screenShares').on('value', snap => {
      liveShares = {};
      snap.forEach(child => { liveShares[child.key] = child.val(); return false; });
      renderLiveList();
      updateHeaderSubtitle();
    });
    db.ref('screenShares').on('child_removed', snap => {
      const key = snap.key;
      if (watchingPeers[key]) stopWatching(key);
    });
  }

  function renderLiveList(){
    const keys = Object.keys(liveShares);
    liveSection.style.display = keys.length ? 'block' : 'none';

    liveList.innerHTML = keys.map(key => {
      const v = liveShares[key];
      const isSelf = key === currentKey;
      const isWatching = !!watchingPeers[key];
      return (
        '<div class="user-row live-row">' +
          '<span class="live-dot-sm"></span>' +
          '<span class="user-row-name">' + escapeHTML(v.display) + (isSelf ? ' (you)' : '') + '</span>' +
          (isSelf ? '' :
            '<button type="button" class="watch-btn' + (isWatching ? ' watching' : '') + '" data-key="' + key + '" data-name="' + escapeHTML(v.display) + '">' +
              (isWatching ? 'Stop' : 'Watch') +
            '</button>') +
        '</div>'
      );
    }).join('');

    liveList.querySelectorAll('.watch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        const name = btn.dataset.name;
        if (watchingPeers[key]) stopWatching(key); else watchStream(key, name);
      });
    });
  }

  function createTile(key, label, isSelf){
    let tile = streamStrip.querySelector(`.stream-tile[data-key="${key}"]`);
    if (tile) return tile;

    tile = document.createElement('div');
    tile.className = 'stream-tile' + (isSelf ? ' is-self' : '');
    tile.dataset.key = key;
    tile.innerHTML =
      '<video autoplay playsinline' + (isSelf ? ' muted' : '') + '></video>' +
      '<div class="tile-label"><span class="live-dot-sm"></span>' + escapeHTML(label) + '</div>' +
      '<button type="button" class="tile-close" title="' + (isSelf ? 'Stop sharing' : 'Stop watching') + '">' + closeIconSVG() + '</button>';

    tile.querySelector('.tile-close').addEventListener('click', () => {
      if (isSelf) stopScreenShare(); else stopWatching(key);
    });

    streamStrip.appendChild(tile);
    streamStrip.style.display = 'flex';
    return tile;
  }

  function removeTile(key){
    const tile = streamStrip.querySelector(`.stream-tile[data-key="${key}"]`);
    if (tile) tile.remove();
    if (!streamStrip.children.length) streamStrip.style.display = 'none';
  }
</script>
